/* ===================================== PRINT SEAM =====================================
   One place all printing goes through. Renders a named text template (thermal-friendly) and hands it to the
   local print-agent hook (window.CUSTOMPOS_PRINT) if one is installed, else prints via the browser. Every job
   carries the ORDER's storeId so a multi-store shop routes each doc to that store's printer / colored paper —
   routing follows the ORDER, never the workstation (kernel invariant). Templates: ticket, tag (per serialized
   unit), bagLabel. Templated-print buttons are opt-in via FLOW.endpoints.print; the on-screen receipt Print is
   always available. Inert (no buttons) unless a flow turns it on. */
function printOn(){ return !!(FLOW.endpoints && FLOW.endpoints.print); }
function printHook(){ return (typeof window!=="undefined" && typeof window.CUSTOMPOS_PRINT==="function") ? window.CUSTOMPOS_PRINT : null; }
function printDoc(kind, text, meta){
  const job = Object.assign({ kind, text, biz:(FLOW.branding&&FLOW.branding.name)||"", storeName:(meta&&meta.storeId)?storeName(meta.storeId):"" }, meta||{});
  const hook = printHook();
  if(hook){ try{ hook(job); }catch(e){} return job; }                          // a print agent handles routing to the store's printer
  try{ const w=window.open("","_blank","width=360,height=640");
    if(w){ w.document.write("<pre style=\"font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;padding:10px\">"+String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</pre>"); w.document.close(); w.focus(); w.print(); setTimeout(()=>{ try{ w.close(); }catch(_){}} ,150); }
    else { window.print(); }
  }catch(e){ try{ window.print(); }catch(_){} }
  return job;
}
function dueDateText(r){ const t=FLOW.timer; if(!t||t.mode!=="due"||!r.ts) return ""; return new Date(r.ts + t.promiseSec*1000).toISOString().slice(0,16).replace("T"," "); }
function docLineText(l){ return "  "+(l.qty||1)+"x "+l.name+(l.modLabel?" ("+l.modLabel+")":"")+(l.seat?"  [Seat "+l.seat+"]":"")+(l.serialized&&l.tag?"  ["+(l.tagLabel||"Tag")+" "+l.tag+"]":"")+(l.bag?"  bag "+l.bag:""); }
function docTicket(r){
  const L=[]; L.push(((FLOW.branding&&FLOW.branding.name)||"Order").toUpperCase());
  if(storesOn()&&r.storeId){ L.push(storeName(r.storeId)); const aa=assembledAt(r); if(aa) L.push(aa); }
  L.push("Order #"+r.number+"   "+(r.createdAt||"")); if(r.customer) L.push((r.customer.name||"")+"   "+(r.customer.phone||""));
  if(r.orderType||r.tableId||(r.channel&&r.channel!=="in-house")) L.push([r.orderType, r.tableId?("Table "+tableLabel(r.tableId)):"", (r.channel&&r.channel!=="in-house")?r.channel:""].filter(Boolean).join("   "));
  L.push("------------------------------"); (r.lines||[]).forEach(l=>L.push(docLineText(l)));
  L.push("------------------------------"); const dd=dueDateText(r); if(dd) L.push("Promised: "+dd);
  return L.join("\n");
}
function docTag(r, l){
  const L=[]; if(storesOn()&&r.storeId) L.push(storeName(r.storeId));
  L.push("#"+r.number+(r.customer?"  "+r.customer.name:"")); L.push(l.name+(l.modLabel?" ("+l.modLabel+")":""));
  if(l.serialized&&l.tag) L.push((l.tagLabel||"Tag")+": "+l.tag); if(l.bag) L.push("Bag "+l.bag); const dd=dueDateText(r); if(dd) L.push("Due "+dd);
  return L.join("\n");
}
function docBagLabel(r, bagNo, count){
  const L=[]; if(storesOn()&&r.storeId){ L.push(storeName(r.storeId)); const aa=assembledAt(r); if(aa) L.push(aa.toUpperCase()); }
  L.push("#"+r.number+(r.customer?"  "+r.customer.name:"")); L.push("BAG "+bagNo+"   ("+count+" piece"+(count===1?"":"s")+")");
  return L.join("\n");
}
function receiptPanel(r){
  const sub=lineSubtotal(r), disc=recordDiscount(r), tax=recordTax(r), tip=r.tip||0, tot=recordTotal(r);
  const line=(l,v,b)=>"<div class='line'>"+(b?"<b>":"<span class='muted'>")+l+(b?"</b>":"</span>")+"<span class='spacer'></span>"+(b?"<b>":"<span>")+v+(b?"</b>":"</span>")+"</div>";
  const lineRow=l=>"<div class='line'><span>"+l.qty+"× "+l.name+(l.modLabel?" ("+l.modLabel+")":"")+(l.serialized&&l.tag?" <small class='muted'>["+(l.tagLabel||"Tag")+" "+l.tag+"]</small>":"")+"</span><span class='spacer'></span><span>"+money(l.price*l.qty)+"</span></div>";
  // 👤 per-seat receipt: when the order was rung by seat, group the itemized lines under each seat with its subtotal
  let rows;
  if(orderHasSeats(r)){
    rows=seatBuckets(r).map(bkt=>{ const its=r.lines.filter(l=>((l.seat?("s"+l.seat):"shared"))===bkt.key);
      return "<div class='line'><b>"+bkt.label+"</b><span class='spacer'></span><b>"+money(bkt.sub)+"</b></div>"+its.map(lineRow).join(""); }).join("");
  } else { rows=r.lines.map(lineRow).join(""); }
  const hr="<hr style='border:none;border-top:1px dashed var(--line)'>";
  const totals=(disc||tax?line("Subtotal",money(sub)):"")+(disc?line("Discount","−"+money(disc)):"")+(tax?line(taxIncluded()?"Tax (incl.)":"Tax",money(tax)):"")+(tip?line("Tip",money(tip)):"")+line("Total",money(tot),true);
  const tenders=(r.tenders||[]).map(t=>line(t.type==="card"?cardLabel(t):t.type[0].toUpperCase()+t.type.slice(1), money(t.amount))).join("");
  const wrap=document.createElement("div"); wrap.className="card"; wrap.style.borderColor="var(--brand)"; wrap.id="receipt";
  wrap.innerHTML="<div class='center'><b>"+FLOW.branding.name+"</b><div class='muted'>Order #"+r.number+" · "+r.createdAt+"</div></div>"+hr+rows+hr+totals+(tenders?hr+tenders:"")+"<p class='center muted' style='margin-top:8px'>Thank you!</p>";
  const pr=document.createElement("button"); pr.className="primary"; pr.textContent="Print"; pr.onclick=()=>window.print(); wrap.appendChild(pr);
  return wrap;
}

          sb.onclick=()=>{ r.splitMode="seat"; delete r.splitWays; delete r.splitShare; const first=seatBuckets(r).find(x=>seatDue(r,x)>0.0001); r.paySeat=first?first.key:null; saveDB(DB); render(); }; opts.appendChild(sb); }
        [2,3,4].forEach(n=>{ const bb=document.createElement("button"); if(r.splitMode!=="seat"&&r.splitWays===n) bb.className="sel"; bb.textContent=n+" ways"; bb.onclick=()=>{ r.splitMode="even"; r.splitWays=n; r.splitShare=+(recordTotal(r)/n).toFixed(2); delete r.paySeat; saveDB(DB); render(); }; opts.appendChild(bb); });
        const no=document.createElement("button"); if(!r.splitWays&&r.splitMode!=="seat") no.className="sel"; no.textContent="No split"; no.onclick=()=>{ delete r.splitWays; delete r.splitShare; delete r.splitMode; delete r.paySeat; saveDB(DB); render(); }; opts.appendChild(no);
        wrap.appendChild(opts); c.appendChild(wrap);
        if(r.splitMode==="seat"){   // one row per seat: its amount, paid ✓ or a "pay this seat" selector
          seatBuckets(r).forEach(bkt=>{ const due=seatDue(r,bkt), amt=seatAmount(r,bkt), done=due<=0.0001;
            const row=document.createElement("div"); row.className="line";
            row.innerHTML="<span>"+(done?"✓ ":"")+bkt.label+" — "+money(amt)+(done?"":" <span class='muted'>· "+money(due)+" due</span>")+"</span><span class='spacer'></span>";
            if(!done){ const pick=document.createElement("button"); if(r.paySeat===bkt.key) pick.className="sel"; pick.textContent=r.paySeat===bkt.key?"paying":"pay this"; pick.onclick=()=>{ r.paySeat=bkt.key; saveDB(DB); render(); }; row.appendChild(pick); }
            else { const t=document.createElement("span"); t.className="pill clock good"; t.textContent="paid"; row.appendChild(t); }
            c.appendChild(row); });
        } else if(r.splitWays){ const paidShares=Math.round((recordTotal(r)-bal)/r.splitShare); const info=document.createElement("div"); info.className="muted"; info.style.margin="4px 0"; info.textContent=r.splitWays+" shares · "+money(r.splitShare)+" each · "+paidShares+" of "+r.splitWays+" paid"; c.appendChild(info); }
      }
      const paySeatBkt = (r.splitMode==="seat"&&r.paySeat) ? seatBuckets(r).find(x=>x.key===r.paySeat) : null;
      const payAmt = paySeatBkt ? Math.min(seatDue(r,paySeatBkt), bal) : (r.splitWays ? Math.min(r.splitShare, bal) : bal);
      const label = paySeatBkt ? (paySeatBkt.label+" ") : (r.splitWays ? "Take share " : (paid>0?"Take balance ":"Take payment "));
      const seatTag = () => (r.splitMode==="seat" && r.paySeat) ? r.paySeat : undefined;   // tag a tender to its seat
      const advanceSeat = () => { if(r.splitMode==="seat"){ const nx=seatBuckets(r).find(x=>seatDue(r,x)>0.0001); r.paySeat=nx?nx.key:null; } };
      const b=document.createElement("button"); b.className="primary"; b.textContent=label+money(payAmt)+" cash"; b.style.marginTop="10px"; b.onclick=()=>{ r.tenders.push({type:"cash",amount:payAmt,seatKey:seatTag()}); logActivity("money", "cash "+money(payAmt), r.number); advanceSeat(); if(recordBalance(r)<=0.0001){ r.status="PAID"; onPaid(r); } cashPad=null; saveDB(DB); render(); }; c.appendChild(b);
      // make change: enter what the customer handed over and see the change due (the cash-drawer moment)
      const mc=document.createElement("button"); mc.textContent="＄ Make change"; mc.style.margin="10px 0 0 8px"; mc.onclick=()=>{ cashPad={ recId:r.id, received:payAmt }; render(); }; c.appendChild(mc);
      if((FLOW.endpoints.payment.tenders||[]).includes("card")){
        const cb=document.createElement("button"); cb.textContent=(r.splitWays?"Share by card ":"Pay by card ")+money(payAmt); cb.style.margin="10px 0 0 8px";
        const idemKey=r.id+":card:"+Math.round(payAmt*100)+":"+cardTenders(r).length;   // stable across a double-tap of THIS button
        cb.onclick=()=>{ const res=chargeCardOnce(r, payAmt, idemKey); if(res.status==="approved"){ if(!res.dedup){ const t=res.tender; if(t) t.seatKey=seatTag(); logActivity("money", "card "+money(payAmt)+(t&&t.brand?" ("+t.brand+" ••"+t.last4+")":""), r.number); advanceSeat(); } if(recordBalance(r)<=0.0001){ r.status="PAID"; onPaid(r); } saveDB(DB); render(); } else { logActivity("money", "card declined "+money(payAmt), r.number); flash("Card "+(res.message||"declined")); } };
        c.appendChild(cb);
      }
      // house account: put it on the customer's tab (A/R) — settles the order now, they pay it later
      if((FLOW.endpoints.payment.tenders||[]).includes("account") && r.customer && r.customer.phone){
        const ab=document.createElement("button"); ab.textContent="Charge to account "+money(payAmt); ab.style.margin="10px 0 0 8px";
        ab.onclick=()=>{ r.tenders.push({type:"account",amount:payAmt,seatKey:seatTag()}); const cust=DB.customers.find(x=>x.phone===r.customer.phone); if(cust){ cust.balance=+((cust.balance||0)+payAmt).toFixed(2); } logActivity("money", "charged to account "+money(payAmt)+(r.customer?" · "+r.customer.name:""), r.number); advanceSeat(); if(recordBalance(r)<=0.0001){ r.status="PAID"; onPaid(r); } saveDB(DB); render(); }; c.appendChild(ab);
      }
      // cash change-making: enter amount tendered, see change due, then take the cash
      if(cashPad && cashPad.recId===r.id){
        const pad=document.createElement("div"); pad.className="mgroup"; pad.style.cssText="border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px"; pad.innerHTML="<div class='lbl'>Cash — amount tendered</div>";
        const row=document.createElement("div"); row.style.cssText="display:flex;align-items:center;gap:8px;flex-wrap:wrap";
        const inp=document.createElement("input"); inp.id="cashRecv"; inp.type="number"; inp.step="0.01"; inp.value=cashPad.received; inp.style.width="110px";
        inp.oninput=()=>{ cashPad.received=Number(inp.value)||0; const cd=document.getElementById("changeDue"); if(cd) cd.textContent="Change due "+money(Math.max(0,cashPad.received-payAmt)); const cf=document.getElementById("cashConfirm"); if(cf) cf.disabled=cashPad.received<payAmt-0.0001; };
        row.appendChild(inp);
        [["Exact",payAmt],["Next $",Math.ceil(payAmt)],["$20",20],["$50",50],["$100",100]].forEach(([lab,val])=>{ if(lab!=="Exact" && val<payAmt-0.0001) return; const cbtn=document.createElement("button"); cbtn.textContent=lab; cbtn.onclick=()=>{ cashPad.received=+(+val).toFixed(2); render(); }; row.appendChild(cbtn); });
        pad.appendChild(row);
        const cd=document.createElement("div"); cd.id="changeDue"; cd.style.cssText="font-size:18px;font-weight:700;margin:8px 0"; cd.textContent="Change due "+money(Math.max(0,(cashPad.received||0)-payAmt)); pad.appendChild(cd);
        const conf=document.createElement("button"); conf.id="cashConfirm"; conf.className="primary"; conf.textContent="✓ Take "+money(payAmt); conf.disabled=(cashPad.received||0)<payAmt-0.0001;
        conf.onclick=()=>{ const recv=+(cashPad.received||payAmt).toFixed(2); const chg=+(recv-payAmt).toFixed(2); r.tenders.push({ type:"cash", amount:payAmt, tendered:recv, change:chg, seatKey:seatTag() }); logActivity("money", "cash "+money(payAmt)+" (tendered "+money(recv)+", change "+money(chg)+")", r.number); advanceSeat(); if(recordBalance(r)<=0.0001){ r.status="PAID"; onPaid(r); } cashPad=null; saveDB(DB); render(); }; pad.appendChild(conf);
        const cx=document.createElement("button"); cx.textContent="Cancel"; cx.style.marginLeft="8px"; cx.onclick=()=>{ cashPad=null; render(); }; pad.appendChild(cx);
        c.appendChild(pad);
      }
    }
    else if(r.status==="READY"){ const b=document.createElement("button"); b.className="good"; b.textContent="Complete (paid)"; b.style.marginTop="10px"; b.onclick=()=>{ r.status="PAID"; onPaid(r); saveDB(DB); render(); }; c.appendChild(b); }   // fully covered by deposit/gift/loyalty
    else if(r.status==="PAID"){ const b=document.createElement("button"); b.className="good"; b.textContent="Done — close"; b.style.marginTop="10px"; b.onclick=()=>{ r.status="CLOSED"; saveDB(DB); render(); }; c.appendChild(b); }
    const rb=document.createElement("button"); rb.textContent=receiptOpen[r.id]?"Hide receipt":"🧾 Receipt"; rb.style.margin="10px 0 0 8px"; rb.onclick=()=>{ receiptOpen[r.id]=!receiptOpen[r.id]; render(); }; c.appendChild(rb);
    // notify: text the customer their order is ready (processor-agnostic; sim records it, hub sends it)
    if(FLOW.endpoints.notify && r.customer && r.customer.phone && (r.status==="READY"||r.status==="PAID")){
      if(!r.notified){ const nb=document.createElement("button"); nb.textContent="📱 Text ready"; nb.style.margin="10px 0 0 8px";
        nb.onclick=()=>{ const body=composeNotify(r); const res=notifyAdapter().send(r.customer.phone, body); if(res.status==="sent"){ r.notified={ to:res.to, body:res.body }; saveDB(DB); render(); } else { flash("Text failed"); } }; c.appendChild(nb); }
      else { const nl=document.createElement("div"); nl.className="muted"; nl.style.marginTop="8px"; nl.textContent="✓ Texted "+r.notified.to+": “"+r.notified.body+"”"; c.appendChild(nl); }
    }
    if(receiptOpen[r.id]) c.appendChild(receiptPanel(r));
    app.appendChild(c); });
  const closed=DB.records.filter(r=>r.status==="CLOSED").length;
  if(closed){ const f=document.createElement("p"); f.className="muted center"; f.textContent=closed+" order(s) completed today."; app.appendChild(f); }
}

window.addEventListener("storage",(e)=>{ if(e.key===dkey()||e.key===skey()||e.key==="custompos_flow") render(); });
if(SYNC.on){ SYNC.pull(); setInterval(()=>SYNC.pull(), 3000); }   // poll the hub when configured
// scaffold notice — set the expectation up front (a foundation to build on, not a turnkey product), remembered once
(function(){ try{ const bar=document.getElementById("scaffoldBar"); if(!bar) return;
  if(localStorage.getItem("custompos_scaffold_ack")!=="1") bar.hidden=false;
  const ok=document.getElementById("scaffoldOk"); if(ok) ok.onclick=()=>{ try{localStorage.setItem("custompos_scaffold_ack","1");}catch(e){} bar.hidden=true; };
}catch(e){} })();
render();
</script>
