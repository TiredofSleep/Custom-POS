<!--
  customPOS — engine skeleton (v0.4)
  ==================================
  Spine (v0.1) · fan-out (v0.2) · per-item paths + central station, two trades on one engine (v0.3).
  v0.4 adds the RULES EVALUATOR — the one mechanism behind several primitives:
    • REQUIRED modifiers  — a choice that must be made before the line can send (steak temp, drink size, starch)
    • SUGGESTED add-ons   — an upsell prompted at order time (oat milk, Scotchgard)
    • 86 / PAR-COUNT      — a remaining-count that decrements and, at zero, disables the item everywhere
  All of it is DATA on the catalog item — no code per trade. Pick the demo business up top.

  One self-contained file, no build, no deps, localStorage. Neutral demo config only.
  Docs: FLOW-SCHEMA.md · MODULE-LIBRARY.md · THE-MODEL.md
-->

<script>
/* ===== CRASH REPORTER (Stage D4) — installed FIRST so a fault during startup (the one you most need to see)
   is captured, not lost. A dead station is silent otherwise: a shell whose page threw on load shows a blank
   screen and the driver just says "it's broken." We capture window.onerror + unhandledrejection, DEDUPE by
   fault signature (a render that throws 400× on a poll is ONE fault, not 400), CAP per page-load, and batch to
   a hub endpoint OUTSIDE the synced DB (a crash log must never ride the merge — it would sync a fault to every
   station). A re-entrancy guard (finally-cleared) means the reporter can never crash inside its own handler. */
var CRASH = (function(){
  var seen = {}, queue = [], sent = 0, CAP = 25, reporting = false;
  function sig(e){ return [ (e && e.message) || e, (e && e.source) || '', (e && e.line) || '', (e && e.col) || '' ].join('|'); }
  function hubUrl(){ try{ var q=new URL(location.href).searchParams.get('hub'); return q || (typeof window!=='undefined'&&window.CUSTOMPOS_HUB) || localStorage.getItem('custompos_hub') || ''; }catch(_){ return ''; } }
  function record(e){
    if (reporting) return;                       // never re-enter (a throw inside here would loop)
    reporting = true;
    try {
      var s = sig(e);
      if (seen[s]) { seen[s].n++; return; }       // same fault again -> just count it, don't re-queue
      if (sent >= CAP) return;                     // a storm is one event, not a flood of reports
      seen[s] = { n:1 };
      var rec = { sig:s, message:(e&&e.message)||String(e), source:(e&&e.source)||'', line:(e&&e.line)||0, col:(e&&e.col)||0,
                  stack:(e&&e.error&&e.error.stack)||'', ts:Date.now(), ua:(navigator&&navigator.userAgent)||'', url:location.href };
      queue.push(rec); sent++;
      var hub = hubUrl();
      if (hub) { try { fetch(hub.replace(/\/$/,'')+'/api/crash', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(rec), keepalive:true }).catch(function(){}); } catch(_){} }
    } catch(_) { /* the reporter must never throw */ }
    finally { reporting = false; }               // ALWAYS clear the guard, even if record() threw
  }
  if (typeof window !== 'undefined') {
    window.addEventListener('error', function(ev){ record({ message:ev.message, source:ev.filename, line:ev.lineno, col:ev.colno, error:ev.error }); });
    window.addEventListener('unhandledrejection', function(ev){ var r=ev&&ev.reason; record({ message:'unhandledrejection: '+((r&&r.message)||r), error:r }); });
  }
  return { record:record, queue:function(){ return queue.slice(); }, count:function(){ return sent; }, distinct:function(){ return Object.keys(seen).length; },
           _reset:function(){ seen={}; queue=[]; sent=0; reporting=false; } };
})();

   ENGINE / SYNC ........ flow selection, localStorage DB, optional hub sync (saveDB)
   MONEY MATH ........... subtotal/discount/tax(incl or added)/total/paid/balance, refunds, returns
   INVENTORY ............ stock on-hand, low/out, reason-coded adjustments
   PAYMENTS / NOTIFY .... processor-agnostic charge/refund + notify seam (sim adapters)
   DATA & BACKUP ........ export (JSON/CSV), import, restore
   RULES EVALUATOR ...... required modifiers, 86/par, needsConfig
   RENDER ............... router (station.type → renderer) + install/PWA
   INTAKE ............... catalog, search/scan, config panel, deposits, capacity, quotes
   PIPELINE / KDS ....... production stations, checklists, kitchen display + bump
   CHECKOUT ............. tips, discounts/coupons, split, tenders, receipts, notify
   REPORT ............... Z-report, drawer, labor, inventory, A/R, refunds/returns, backup
   TIMECLOCK / BOOKING .. staff PIN + welcome; appointments → check-in

const STATUS_LABEL = { INPROGRESS:"In progress", READY:"Ready for pickup", PAID:"Ready for pickup", CLOSED:"Picked up" };
/* Config-driven NAMED LIFECYCLE STAGE for an order (e.g. Received → Detailing → Assembly → Racked → Ready → Picked up).
   Derives from the least-advanced incomplete line's current station, so the order reads as "where the slowest piece is."
   FLOW.lifecycle overrides the labels; FLOW.lifecycle.public overrides the customer-tracker phrasing. No trade code — pure config.
   Falls back to sensible defaults (station labels) when no lifecycle config is present, so every trade benefits. */
function stageOf(r, pub){
  const base = (FLOW.lifecycle) || {}; const L = (pub && base.public) ? Object.assign({}, base, base.public) : base;
  if(r.undetailed) return L.dropped || "Received — being itemized";
  if(r.status === "CLOSED") return L.done || "Picked up";
  if(r.status === "READY" || r.status === "PAID") return L.ready || "Ready for pickup";
  const inc = (r.lines||[]).filter(l => !lineComplete(l));
  if(!inc.length) return L.ready || "Ready for pickup";
  const started = (r.lines||[]).some(l => (l.stage||0) > 0 || lineComplete(l));
  if(!started) return L.received || "Received";
  let least = inc[0]; inc.forEach(l => { if((l.stage||0) < (least.stage||0)) least = l; });
  const stId = least.path[least.stage||0];
  const station = (FLOW.stations||[]).find(s => s.id === stId);
  return (L.byStation && L.byStation[stId]) || (station && (station.stageLabel || station.label)) || "In progress";
}

/* PER-COLLECTION MIRROR (Stage B3) — every save also writes each collection under its OWN key (dkey()+"::"+col).
   Two payoffs, both generalized from Ozark's worst failure (a station that opens on an EMPTY shop): (1) a torn
   write corrupts one collection's key, not the whole shop; (2) when the main blob is corrupt/missing, loadDB
   REBUILDS from the mirror instead of returning empty. The main blob stays the canonical store (written every
   save — backward compatible, and the source that heals a corrupt mirror), so the normal read path is unchanged
   and a mirror is consulted ONLY when the blob itself fails to parse. */
// A DISTINCT prefix so a mirror key never collides with the blob's own key family — anything that enumerates
// `custompos_*` keys (a backup/export, a flow switch, a test locating the blob) must not trip over the mirror.
function mirrorPrefix(){ return "cpmirror::"+dkey()+"::"; }
function rebuildFromMirror(){
  try{ if(localStorage.getItem(mirrorPrefix()+"records")===null) return null;   // no mirror -> a genuinely empty shop
    const out={}, pfx=mirrorPrefix();
    for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
      if(k && k.indexOf(pfx)===0){ try{ out[k.slice(pfx.length)]=JSON.parse(localStorage.getItem(k)); }catch(e){} } }
    return Array.isArray(out.records) ? out : null;   // records must be sane or it isn't a shop worth healing to
  }catch(e){ return null; }
}
function loadDB(){
  let d=null; try{ d=JSON.parse(localStorage.getItem(dkey())); }catch(e){ d=null; }
  if(!d || typeof d!=="object" || !Array.isArray(d.records)) d=rebuildFromMirror();   // heal a corrupt/missing blob
  return dbDefaults(d);
}
function persistDB(db){
  try{ localStorage.setItem(dkey(), JSON.stringify(db)); }catch(e){}     // canonical whole-DB blob (compat + heal source)
  try{ const pfx=mirrorPrefix();                                          // mirror: rewrite only the parts that moved
    for(const col in db){ if(!Object.prototype.hasOwnProperty.call(db,col)) continue;
      const cs=JSON.stringify(db[col]); if(localStorage.getItem(pfx+col)!==cs) localStorage.setItem(pfx+col, cs); }
  }catch(e){}
}
/* OPTIONAL multi-device sync — OFF unless a hub is configured (?hub=… / window.CUSTOMPOS_HUB / localStorage).
   When on, every save pushes to the hub and a poller pulls the merged DB, so separate devices share one POS. */
const SYNC = {
  url(){ try{ const q=new URL(location.href).searchParams.get("hub"); return q || (typeof window!=="undefined"&&window.CUSTOMPOS_HUB) || localStorage.getItem("custompos_hub") || ""; }catch(e){ return ""; } },
  get on(){ return !!this.url(); }, applying:false, rev:0,   // rev = the last hub revision this device holds
  // DELTA PUSH (Stage B2): send only the records/customers whose content differs from what the hub last
  // confirmed it holds (`_pushed` = the hub's known copy, refreshed from every hub response). Ringing one
  // order uploads one record, not the whole shop; an idle save uploads nothing (skips the request entirely).
  // Safe because the hub upserts and absence never deletes — a partial push can't drop what it omits.
  _pushed:{}, _pushedSeq:0, _sig(r){ return JSON.stringify(r); },
  push(){ if(!this.on) return;
    const db=loadDB();
    const recs =(db.records  ||[]).filter(r=>this._pushed["r:"+r.id]   !==this._sig(r));
    const custs=(db.customers||[]).filter(c=>this._pushed["c:"+c.phone]!==this._sig(c));
    const seqMoved=(db.seq||0)>(this._pushedSeq||0);
    if(!recs.length && !custs.length && !seqMoved) return;   // nothing moved since the hub last confirmed
    const payload={ records:recs, customers:custs, seq:db.seq||0 };
    try{ fetch(this.url().replace(/\/$/,"")+"/api/db",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({db:payload})}).then(r=>r.json()).then(j=>this.applyRemote(j.db, j.rev)).catch(()=>{}); }catch(e){} },
  // DELTA PULL (Stage B1): ask only for what moved since the rev we hold. A fresh device (rev 0) gets the
  // whole set; a caught-up device gets a few KB. The hub answers {db:{records,customers,seq}, rev, delta?}.
  pull(){ if(!this.on) return; try{ fetch(this.url().replace(/\/$/,"")+"/api/db?since="+(this.rev||0)).then(r=>r.json()).then(j=>this.applyRemote(j.db, j.rev)).catch(()=>{}); }catch(e){} },
  // Merge the hub's records/customers INTO the local DB (never replace it wholesale). Two reasons: (1) a delta
  // carries only what changed, so a merge is the only correct way to fold it in; (2) the hub syncs only
  // records+customers, so replacing would wipe this device's local-only collections (punches, bookings…).
  // stampNewer picks the winner and the one-way status law holds, exactly as on the hub — a slow local clock
  // still can't be clobbered by a stale remote copy, and an order never rolls backward.
  applyRemote(db, rev){ if(!db) return; const local=loadDB();
    local.records   = syncMergeArr(local.records||[],   db.records||[],   "id",    true);
    local.customers = syncMergeArr(local.customers||[], db.customers||[], "phone", false);
    local.seq = Math.max(local.seq||0, db.seq||0);
    // remember exactly what the hub reported it holds, so the next push sends only genuinely-newer local edits
    (db.records  ||[]).forEach(r=>{ this._pushed["r:"+r.id]   =this._sig(r); });
    (db.customers||[]).forEach(c=>{ this._pushed["c:"+c.phone]=this._sig(c); });
    this._pushedSeq=Math.max(this._pushedSeq||0, db.seq||0);
    if(typeof rev==="number") this.rev = Math.max(this.rev||0, rev);
    this.applying=true; try{ persistDB(local); }catch(e){} this.applying=false;
    DB=loadDB(); render(); },
  // THE MIRROR (D1): fingerprint the local collections, ask the hub which disagree, and HEAL a named one by
  // forcing a full re-pull (reset rev/_pushed so the next pull is `?since=0` and the merge reconciles both ways).
  verify(){ if(!this.on) return Promise.resolve(null); const db=loadDB();
    const fp={ records:fingerprint(db.records,"id"), customers:fingerprint(db.customers,"phone") };
    try{ return fetch(this.url().replace(/\/$/,"")+"/api/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fp})}).then(r=>r.json()).then(j=>{
      if(j && j.disagree && j.disagree.length){ this.rev=0; this._pushed={}; this._pushedSeq=0; this.pull(); }   // heal
      return j; }).catch(()=>null); }catch(e){ return Promise.resolve(null); } }
};
/* SYNC CLOCK — the same monotonic hybrid clock + comparison the hub uses (hub.js). ⚠️ Keep these three
   IDENTICAL in both places; tests/engine-clock.js fails if they drift. A station's wall clock can be wrong
   (a dead CMOS battery is a real shop scenario): hlcNow() never goes backward, so an edit made on a slow
   clock still supersedes the copy it replaces, and stampScale/stampNewer rank a bare-ms and a hybrid stamp
   on one number line without the 1000x error. */
let _hlc=0;
function hlcNow(){ _hlc=Math.max(Date.now()*1000, _hlc+1); return _hlc; }
function stampScale(t){ t=+t||0; return t<1e15 ? t*1000 : t; }
function stampNewer(a,b){ return stampScale(a)>=stampScale(b); }
// One-way status law (mirrors hub.js ORDER_RANK): a stale stamp can pick whose fields win, but it can never
// roll an order's status below what this device already knows — a race the hub also refuses server-side.
const ORDER_RANK={ INPROGRESS:1, READY:2, PAID:3, CLOSED:4, REFUNDED:5 };
// The client half of the hub's mergeArr: fold an incoming (delta or full) set into the base keyed by `key`.
// The base is authoritative for what's PRESENT (absence never deletes — a delta only ever upserts); a record
// replaces its stored copy only when stampNewer says so; with advanceOnly, a winner's status can't fall.
function syncMergeArr(base, incoming, key, advanceOnly){
  const by=new Map((base||[]).map(r=>[r[key], r]));
  (incoming||[]).forEach(r=>{ const prev=by.get(r[key]);
    let win=(!prev || stampNewer(r.upd, prev.upd)) ? r : prev;
    if(advanceOnly && prev && ORDER_RANK[prev.status] > (ORDER_RANK[win.status]||0)) win={...win, status:prev.status};
    by.set(r[key], win); });
  return [...by.values()];
}
// D1 — THE MIRROR. This fingerprint block MUST be byte-identical to the one in hub.js (a fingerprint that means
// something different on each side would invent drift or hide it); tests/mirror-fingerprint.js gates the bytes.
/*<<FP>>*/
function fpHash(s){var h=5381;for(var i=0;i<s.length;i++){h=((h*33)^s.charCodeAt(i))>>>0;}return h;}
function fingerprint(list,key){var a=(list||[]).map(function(r){return String(r&&r[key])+':'+fpHash(JSON.stringify(r));});a.sort();return{n:a.length,hash:fpHash(a.join('|'))};}
/*<</FP>>*/
function saveDB(db){
  // stamp a modification time on any record whose content changed, so hub merge keeps the newer copy
  try{ const prev=JSON.parse(localStorage.getItem(dkey())||"{}"); const norm=r=>JSON.stringify({...r, upd:0});
    const was=new Map((prev.records||[]).map(r=>[r.id, norm(r)]));
    (db.records||[]).forEach(r=>{ if(was.get(r.id)!==norm(r)) r.upd=hlcNow(); });
  }catch(e){}
  persistDB(db); if(SYNC.on && !SYNC.applying) SYNC.push();
}

/* ===================================== MONEY MATH ===================================== */
function lineSubtotal(r){ return r.lines.reduce((s,l)=> s + l.price*l.qty, 0); }
function recordDiscount(r){ return Math.min(r.discount||0, lineSubtotal(r)); }
function taxIncluded(){ return !!(FLOW.endpoints.tax && FLOW.endpoints.tax.included); }
/* Tax rate for an order. Default is the shop's own (origin) rate. When FLOW.endpoints.tax.zones is configured
   (destination-based sales tax — e.g. a delivery into another town/jurisdiction), an order tagged with a
   taxZone is taxed at that zone's rate instead. General: delivery, a truck that parks in different towns, a
   caterer billing the event's address. Backward-compatible — no zones ⇒ the flat rate, exactly as before. */
function orderTaxRate(r){ const t=FLOW.endpoints.tax; if(!t) return 0;
  if(r && r.taxZone && Array.isArray(t.zones)){ const z=t.zones.find(z=>z.name===r.taxZone); if(z) return +z.rate||0; }
  return +t.rate||0; }
/* Rate for ONE line. Non-taxable items (taxable:false) and gift cards are 0. When FLOW.endpoints.tax.classes
   is configured (states that tax categories differently — grocery exempt, prepared food/soda taxed), an item's
   taxClass picks that class's rate; otherwise the order's default (zone-aware) rate applies. Lets a single
   basket mix rates line by line. Backward-compatible — no classes ⇒ every taxable line uses the default rate. */
function lineTaxRate(l, r){ const t=FLOW.endpoints.tax; if(!t) return 0;
  if(l.taxable===false || l.category==="giftcard") return 0;
  const it=(FLOW.catalog||[]).find(i=>i.id===l.catId); const cls=(it&&it.taxClass)||l.taxClass;
  if(cls && t.classes && t.classes[cls]!=null) return +t.classes[cls]||0;
  return orderTaxRate(r); }
function recordTax(r){                                   // per-LINE rate (class/zone aware); non-taxable & gift cards excluded; discount prorated
  const t=FLOW.endpoints.tax; if(!t) return 0;
  const sub=lineSubtotal(r); if(sub<=0) return 0;
  const discFactor=(sub-recordDiscount(r))/sub;                        // spread any discount evenly across lines
  let tax=0; const inc=taxIncluded();
  r.lines.forEach(l=>{ const rate=lineTaxRate(l,r); if(!rate) return; const base=l.price*l.qty*discFactor;
    tax += inc ? base*rate/(1+rate)                                    // VAT-style: tax already inside the price
               : base*rate; });                                        // added on top
  return +tax.toFixed(2);
}
function recordNet(r){ return +(lineSubtotal(r) - recordDiscount(r) - (taxIncluded()?recordTax(r):0)).toFixed(2); }   // sales excluding tax
function recordTotal(r){ return +(lineSubtotal(r) - recordDiscount(r) + (taxIncluded()?0:recordTax(r)) + (r.tip||0) + (r.roundUp||0)).toFixed(2); }   // included tax is already inside the price; roundUp = optional charity add-on
// age-restricted items (tobacco/alcohol/lottery): an item's ageRestricted (true→21, or a number) drives an ID-check gate at checkout
function lineAge(l){ const it=FLOW.catalog.find(i=>i.id===l.catId); const a=it&&it.ageRestricted; return a===true?21:(+a||0); }
function orderAgeReq(r){ return Math.max(0, ...((r.lines||[]).filter(l=>!l.returned).map(lineAge))); }
// whole-year age from a TYPED birthdate — accepts YYYY-MM-DD or M/D/YYYY; null if it isn't a real date.
// We compute and gate on the age; we deliberately do NOT store the raw DOB (the defensible record is
// "age N was verified/refused, when, at which station" — not the customer's date of birth).
function ageFromDOB(s){ s=String(s||"").trim(); if(!s) return null;
  var m1=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/), m2=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/), y,m,d;
  if(m1){ y=+m1[1]; m=+m1[2]; d=+m1[3]; } else if(m2){ m=+m2[1]; d=+m2[2]; y=+m2[3]; } else return null;
  if(m<1||m>12||d<1||d>31) return null;
  var dob=new Date(y,m-1,d); if(dob.getFullYear()!==y||dob.getMonth()!==m-1||dob.getDate()!==d) return null;   // rejects 02/30 etc.
  if(dob>new Date()) return null;
  var now=new Date(), a=now.getFullYear()-y; if(now.getMonth()<m-1||(now.getMonth()===m-1&&now.getDate()<d)) a--; return a; }
function recordPaid(r){ return (r.tenders||[]).reduce((s,t)=> s + t.amount, 0); }
function recordBalance(r){ return +(recordTotal(r) - recordPaid(r)).toFixed(2); }
// 👤 SPLIT BY SEAT — each guest pays their own. One bucket per seat (+ a "Shared" bucket for whole-table lines).
// A seat's amount = its share of the line subtotal, scaled to the record total so tax/tip/discount ride along.
function orderHasSeats(r){ return (r.lines||[]).some(l=>!l.returned && l.seat); }
function seatBuckets(r){ const map={};
  (r.lines||[]).forEach(l=>{ if(l.returned) return; const k=l.seat?("s"+l.seat):"shared";
    (map[k]=map[k]||{ key:k, seat:l.seat||null, label:l.seat?("Seat "+l.seat):"Shared", sub:0 }).sub += l.price*l.qty; });
  return Object.keys(map).sort((a,b)=>(map[a].seat||0)-(map[b].seat||0)).map(k=>map[k]); }
function seatAmount(r, bucket){ const subTot=(r.lines||[]).filter(l=>!l.returned).reduce((s,l)=>s+l.price*l.qty,0)||1;
  return +(recordTotal(r) * bucket.sub / subTot).toFixed(2); }
function seatPaid(r, key){ return (r.tenders||[]).filter(t=>t.seatKey===key).reduce((s,t)=>s+t.amount,0); }
function seatDue(r, bucket){ return +Math.max(0, seatAmount(r,bucket)-seatPaid(r,bucket.key)).toFixed(2); }
function firstPerformer(r){ const l=r.lines.find(x=>x.performer); return l?l.performer:null; }
// refund reverses every original tender back to itself (card → card, cash → cash) and marks the order REFUNDED
function refundRecord(r){
  (r.tenders||[]).filter(t=>!t.refund).forEach(t=>{ if(t.type==="card" && payAdapter().refund){ payAdapter().refund(t.ref, Math.round(t.amount*100)); } });
  // reversing a house-account charge also credits the customer's balance (A/R)
  if(r.customer){ const cust=(DB.customers||[]).find(x=>x.phone===r.customer.phone); if(cust){ const acct=(r.tenders||[]).filter(t=>!t.refund&&t.type==="account").reduce((s,t)=>s+t.amount,0); if(acct){ cust.balance=+((cust.balance||0)-acct).toFixed(2); if(cust.balance<0) cust.balance=0; } } }
  const refunded=(r.tenders||[]).filter(t=>!t.refund).reduce((s,t)=>s+t.amount,0);
  (r.tenders||[]).filter(t=>!t.refund).slice().forEach(t=>{ r.tenders.push({ type:t.type, amount:+(-t.amount).toFixed(2), refund:true, ref:t.ref }); });
  r.status="REFUNDED"; r.refundedAt=new Date().toISOString().slice(11,16);
  logActivity("refund", "full refund "+money(refunded)+" on #"+r.number+" — "+r.lines.length+" item(s)", r.number, refunded);
}
function returnedSubtotal(r){ return (r.lines||[]).filter(l=>l.returned).reduce((s,l)=>s+l.price*l.qty,0); }
// LINE-LEVEL return: refund selected lines' share of the total to the original tender(s), mark them returned
function returnLines(r, lineIds){
  const allSub=lineSubtotal(r); if(allSub<=0) return;
  const retSub=r.lines.filter(l=>lineIds.includes(l.id)).reduce((s,l)=>s+l.price*l.qty,0); if(retSub<=0) return;
  const amount=+((retSub/allSub)*recordTotal(r)).toFixed(2);
  const pos=(r.tenders||[]).filter(t=>!t.refund && t.amount>0); const posTotal=pos.reduce((s,t)=>s+t.amount,0)||amount;
  pos.forEach(t=>{ const share=+(-(amount*t.amount/posTotal)).toFixed(2); if(share){ if(t.type==="card"&&payAdapter().refund) payAdapter().refund(t.ref, Math.round(-share*100)); r.tenders.push({ type:t.type, amount:share, refund:true, ref:t.ref }); } });
  if(r.customer){ const cust=(DB.customers||[]).find(x=>x.phone===r.customer.phone); if(cust){ const acctPos=pos.filter(t=>t.type==="account").reduce((s,t)=>s+t.amount,0); if(acctPos>0){ const acctShare=+((amount*acctPos/posTotal)).toFixed(2); cust.balance=+((cust.balance||0)-acctShare).toFixed(2); if(cust.balance<0) cust.balance=0; } } }
  const names=lineIds.map(id=>{ const l=r.lines.find(x=>x.id===id); return l?l.name:null; }).filter(Boolean);
  lineIds.forEach(id=>{ const l=r.lines.find(x=>x.id===id); if(l) l.returned=true; });
  if(r.lines.every(l=>l.returned)) r.status="REFUNDED";
  r.refundedAt=new Date().toISOString().slice(11,16);
  logActivity("refund", "line refund "+money(amount)+" on #"+r.number+" — "+names.join(", "), r.number, amount);
  saveDB(DB); render();
}
// 🎁 COMP a line — take it to $0 with a reason on the record. Distinct from a discount (a %-off promo): a comp
// is discretionary ("kitchen error", "long wait", "on the house"). Manager-approved when the instance opts in
// (FLOW.endpoints.approvals.comp + approver roles) — otherwise reason-only. Reversible via the same control.
const COMP_REASONS=["Manager comp","Kitchen error","Long wait","Customer service","Birthday","On the house"];
function compLine(r, l){
  if(l.comped){ withApproval("comp","Un-comp "+l.name,(who)=>{ l.price=(l.comped&&l.comped.wasPrice)||l.price; delete l.comped; logActivity("comp","un-comped "+l.name+(who?" (by "+who.name+")":""), r.number); saveDB(DB); }); return; }
  const reason=prompt("Comp "+l.name+" — reason?\n("+COMP_REASONS.join(" · ")+")", "Manager comp");
  if(reason==null) return;
  const amt=+(l.price*l.qty).toFixed(2);
  withApproval("comp","Comp "+l.name+" ("+money(amt)+") — "+(reason.trim()||"Manager comp"),(who)=>{
    l.comped={ reason:(reason.trim()||"Manager comp"), by:(who?who.name:((typeof actingStaff==="function"&&actingStaff())||"")), at:new Date().toISOString().slice(11,16), wasPrice:l.price, amount:amt };
    l.price=0; logActivity("comp","comped "+l.name+" — "+(reason.trim()||"Manager comp")+(who?" (by "+who.name+")":""), r.number, amt); saveDB(DB); });
}

/* Processor-agnostic PAYMENTS interface (matches docs/PAYMENTS-MODULE.md). By default — with no processor
   connected — the "record" adapter simply RECORDS a card sale on the order (so the books and the drawer are
   right); it does not contact any processor and does not invent an approval or a card number. Connect the
   certified CardConnect adapter on your own server to actually charge cards; it swaps in by setting
   endpoints.payment.provider. The browser only ever sees a token + last4 + brand — never a card number. */
const PAYMENTS = {
  record: {
    label:"Record only (no processor connected)",
    charge(amountCents, idemKey){ return { status:"approved", recorded:true, ref:"" }; },   // idemKey forwarded to a real processor; nothing is charged here
    refund(ref, amountCents){ return { status:"refunded", recorded:true, ref:"" }; }  // records the reversal
  }
};
function payAdapter(){ const pr=(FLOW.endpoints.payment&&FLOW.endpoints.payment.provider)||"record"; return PAYMENTS[pr]||PAYMENTS.record; }
function cardTenders(r){ return (r.tenders||[]).filter(t=>t.type==="card" && !t.refund); }
/* IDEMPOTENT CARD CHARGE (Stage E3). A double-tapped Pay button or a retried request must never charge twice.
   The guard asks the APPEND-ONLY tender ledger, never a boolean flag (a flag gets rolled back by a merge and
   double-charges anyway): if a card tender already carries this idempotency key, this is a retry — return the
   existing tender WITHOUT charging again. The key is also forwarded to the processor, so the real seam dedups
   on its side too. The record is the source of truth. */
function chargeCardOnce(r, payAmt, idemKey){
  const dup=(r.tenders||[]).find(t=>t.idem===idemKey && !t.refund);
  if(dup) return { status:"approved", dedup:true, tender:dup };
  const res=payAdapter().charge(Math.round(payAmt*100), idemKey);
  if(res && res.status==="approved"){ const tender={ type:"card", amount:payAmt, last4:res.last4, brand:res.brand, ref:res.ref, idem:idemKey };
    (r.tenders=r.tenders||[]).push(tender); return { status:"approved", tender:tender }; }
  return res || { status:"error" };
}
function cardLabel(t){ return t && t.brand ? ("💳 "+t.brand+" ••"+t.last4) : "💳 Card"; }   // real processor gives brand/last4; record-only just says "Card"

/* NOTIFY — the same processor-agnostic shape as payments. With no hub connected the "record" adapter records
   the message so the POS works offline; a hub adapter (Twilio etc.) does the real send server-side. The
   browser never holds an API key. */
const NOTIFY = { record: { label:"Record only (connect a hub to send)", send(to, body){ return { status:"sent", to, body }; } } };
function notifyAdapter(){ const pr=(FLOW.endpoints.notify&&FLOW.endpoints.notify.provider)||"record"; return NOTIFY[pr]||NOTIFY.record; }
function composeNotify(r){
  const t=(FLOW.endpoints.notify&&FLOW.endpoints.notify.template)||"Hi {name}, your order #{number} at {biz} is ready.";
  return t.replace(/\{name\}/g, (r.customer&&r.customer.name)||"there").replace(/\{number\}/g, r.number).replace(/\{biz\}/g, FLOW.branding.name).replace(/\{status\}/g, STATUS_LABEL[r.status]||r.status).replace(/\{balance\}/g, money(Math.max(0,recordBalance(r))));
}
function lineComplete(l){ return l.stage >= l.path.length; }
function allComplete(r){ return r.lines.every(lineComplete); }
// COURSE PACING: with coursing on, only fired courses reach the line; later courses hold until "fired".
function coursingOn(){ return !!(FLOW.endpoints && FLOW.endpoints.coursing); }
function courseOf(l){ return l.course||1; }
function courseReleased(r, l){ return !coursingOn() || courseOf(l) <= (r.firedCourse||1); }
function courseLabel(n){ const c=(FLOW.endpoints&&FLOW.endpoints.coursing&&FLOW.endpoints.coursing.labels)||FLOW.courses; return (c&&c[n-1]) || ("Course "+n); }
function maxCourse(r){ return Math.max(1, ...r.lines.map(courseOf)); }
function heldCourses(r){ return coursingOn() && (r.firedCourse||1) < maxCourse(r) && r.status==="INPROGRESS"; }
function fireNextCourse(r){ r.firedCourse=(r.firedCourse||1)+1; saveDB(DB); render(); }
function linesAtStation(r, stationId){ return r.lines.filter(l => !lineComplete(l) && courseReleased(r,l) && l.path[l.stage]===stationId); }
function afterChange(r){ if(r.status==="INPROGRESS" && allComplete(r)) r.status="READY"; saveDB(DB); }

/* --- TIMER / SLA service: one primitive, aging or back-scheduled-due, threshold colors --- */
function fmtDur(s){ s=Math.max(0,Math.round(s)); if(s>=3600){ const h=Math.floor(s/3600), m=Math.round((s%3600)/60); return h+"h "+m+"m"; } const m=Math.floor(s/60); return m+":"+String(s%60).padStart(2,"0"); }
function clockChip(r){
  const t=FLOW.timer; if(!t||!r.ts) return "";
  let cls, txt;
  if(t.mode==="due"){ const rem=(r.ts + t.promiseSec*1000 - Date.now())/1000;
    cls = rem<0 ? "bad" : rem<=t.warnSec ? "warn" : "good"; txt = rem<0 ? "OVERDUE" : "due "+fmtDur(rem); }
  else { const el=(Date.now()-r.ts)/1000; cls = el>=t.badSec ? "bad" : el>=t.warnSec ? "warn" : "good"; txt = fmtDur(el); }
  return " <span class='pill clock "+cls+"'>"+txt+"</span>";
}

/* --- the RULES EVALUATOR: par/86 remaining, and modifier requirements --- */
function soldOf(catId){
  let n = DB.records.reduce((s,r)=> s + r.lines.filter(l=>l.catId===catId).reduce((a,l)=>a+l.qty,0), 0);
  if(draft) n += draft.lines.filter(l=>l.catId===catId).reduce((a,l)=>a+l.qty,0);
  return n;
}
function remainingOf(item){ return item.par==null ? Infinity : item.par - soldOf(item.id); }
function is86(item){ return remainingOf(item) <= 0; }
// INVENTORY: on-hand = starting stock + any received − everything sold. Tracked only when item.stock is set.
/* ===================================== INVENTORY ===================================== */
function tracksStock(item){ return item.stock!=null; }
function stockOnHand(item){ return (item.stock||0) + ((DB.received||{})[item.id]||0) - soldOf(item.id); }
// reason-coded stock change: receive/transfer add or remove, waste removes, recount sets the on-hand
const STOCK_REASONS = { "Receive":1, "Transfer in":1, "Transfer out":-1, "Waste":-1, "Recount":0 };
function adjustStock(item, qty, reason){
  qty=Number(qty)||0; if(!qty && reason!=="Recount") return;
  const sign=STOCK_REASONS[reason]!=null?STOCK_REASONS[reason]:1;
  const delta = reason==="Recount" ? +(qty - stockOnHand(item)) : sign*Math.abs(qty);
  DB.received=DB.received||{}; DB.received[item.id]=(DB.received[item.id]||0)+delta;
  DB.adjustLog=DB.adjustLog||[]; DB.adjustLog.push({ catId:item.id, name:item.name, reason, delta, at:new Date().toISOString().slice(11,16), day:todayStr() });
  saveDB(DB); logActivity("stock", reason+" "+item.name+" "+(delta>0?"+":"")+delta); render();
}
function isLowStock(item){ return tracksStock(item) && stockOnHand(item) <= (item.reorderAt!=null?item.reorderAt:0); }
function isOutOfStock(item){ return tracksStock(item) && stockOnHand(item) <= 0; }
// ⏰ TIME WINDOWS — day-part menus (breakfast till 11) + happy-hour pricing. A window is {days?:[0-6], from, to}
// ("HH:MM"); days omitted = every day; from/to omitted = all day; from>to spans midnight. All read the live clock.
function hmToMin(s){ const m=String(s||"").match(/^(\d{1,2}):(\d{2})$/); return m?(+m[1]*60 + +m[2]):null; }
function withinWindow(win, at){ if(!win) return false; const now=at||new Date(); const day=now.getDay();
  if(Array.isArray(win.days) && win.days.length && win.days.indexOf(day)<0) return false;
  const f=hmToMin(win.from), t=hmToMin(win.to); if(f==null||t==null) return true;
  const cur=now.getHours()*60+now.getMinutes(); return f<=t ? (cur>=f&&cur<t) : (cur>=f||cur<t); }
function happyActive(at){ return withinWindow(FLOW.endpoints && FLOW.endpoints.happyHour, at); }   // shop-wide happy-hour window
function itemAvailNow(item, at){ return !item || !item.avail || withinWindow(item.avail, at); }      // day-part availability
function itemPriceNow(item, at){ return (item && item.happyPrice!=null && happyActive(at)) ? +item.happyPrice : (item?item.price:0); }  // happy-hour price when live
function needsConfig(item){ return (item.modifiers&&item.modifiers.length) || (item.addons&&item.addons.length) || (item.flags&&item.flags.length) || item.performer; }

/* ============================================================================ RENDER */
function money(n){ return "$"+n.toFixed(2); }
function dayOf(ts){ return new Date(ts||Date.now()).toLocaleDateString("en-CA"); }   // local YYYY-MM-DD
function todayStr(){ return new Date().toLocaleDateString("en-CA"); }
function shiftDay(dstr, delta){ const d=new Date(dstr+"T12:00:00"); d.setDate(d.getDate()+delta); return d.toLocaleDateString("en-CA"); }
function flash(msg){ let t=document.getElementById("toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.setAttribute("role","status"); t.setAttribute("aria-live","polite"); t.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bad);color:#fff;padding:10px 16px;border-radius:8px;z-index:99;font-weight:600"; document.body.appendChild(t); } t.textContent=msg; t.style.display="block"; }
/* ===================================== ACTIVITY LOG (audit trail) =====================================
   One durable stream of every meaningful action the POS takes — orders, money, overrides, voids, refunds,
   discounts, ID checks, stock changes, staff clock events, station access. NOT literal keystrokes (noise +
   privacy); the theft-relevant events, each attributed to a station, the acting staff (when one person is
   clocked in), and a timestamp. Owner-facing, exportable, capped so localStorage never runs away.
   Categories: order · money · override · void · refund · discount · idcheck · stock · clock · access · admin. */
const ACT_CAT = { order:"money", money:"money", refund:"money", discount:"money", comp:"override", override:"override", void:"override", idcheck:"access", clock:"access", access:"access", stock:"admin", admin:"admin" };
function actingStaff(){ try{ const on=(FLOW.staff||[]).filter(s=>openPunch(s.id)); return on.length===1?on[0].name:(on.length>1?"(multiple on shift)":""); }catch(e){ return ""; } }
function logActivity(type, detail, orderNo, amt){
  try{ DB=DB||loadDB(); DB.activity=DB.activity||[];
    const st=(typeof boundStation==="function")?boundStation():null;
    DB.activity.push({ ts:Date.now(), at:new Date().toISOString().slice(11,16), day:todayStr(), type, detail:detail||"", order:(orderNo!=null?orderNo:null), amt:(amt!=null?+(+amt).toFixed(2):null), station:(st&&st.label)||"", staff:actingStaff() });
    if(DB.activity.length>3000) DB.activity=DB.activity.slice(-3000);   // keep the most recent 3000 events
    saveDB(DB);
  }catch(e){}
}
function activityCSV(day){ const rows=[["time","type","detail","amount","order","station","staff"]];
  (loadDB().activity||[]).filter(a=>!day||a.day===day).forEach(a=>rows.push([a.at, a.type, a.detail, a.amt==null?"":a.amt, a.order==null?"":("#"+a.order), a.station, a.staff]));
  return csvRows(rows); }
// data ownership: your data is yours to take out. Everything below builds plain files from the local DB.
/* ===================================== DATA & BACKUP ===================================== */
function downloadFile(name, text, type){ const blob=new Blob([text],{type:type||"text/plain"}); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); }
function csvCell(v){ v=(v==null?"":String(v)); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function csvRows(rows){ return rows.map(r=>r.map(csvCell).join(",")).join("\n"); }
function backupJSON(){ return JSON.stringify({ app:"customPOS", flowId:flowId(), exportedAt:new Date().toISOString(), data:loadDB() }, null, 2); }
function customersCSV(){ const cs=(loadDB().customers||[]); return csvRows([["name","phone","points","gift","balance"], ...cs.map(c=>[c.name||"",c.phone||"",c.points||0,c.gift||0,c.balance||0])]); }
function salesCSV(day){ const d=loadDB(); const done=d.records.filter(r=>(r.status==="PAID"||r.status==="CLOSED"||r.status==="REFUNDED") && dayOf(r.ts)===day);
  return csvRows([["order","time","status","items","subtotal","discount","tax","tip","total","tenders"],
    ...done.map(r=>[r.number, r.createdAt||"", r.status, r.lines.map(l=>l.qty+"x "+l.name).join("; "), lineSubtotal(r).toFixed(2), recordDiscount(r).toFixed(2), recordTax(r).toFixed(2), (r.tip||0).toFixed(2), recordTotal(r).toFixed(2), (r.tenders||[]).map(t=>t.type+":"+t.amount).join("; ")])]); }
function catalogCSV(){ return csvRows([["name","price","category","barcode","taxable","on_hand","reorder_at"],
  ...FLOW.catalog.map(i=>[i.name, i.price, i.category||"", i.barcode||"", i.taxable!==false, tracksStock(i)?stockOnHand(i):"", i.reorderAt!=null?i.reorderAt:""])]); }
function importCustomersCSV(text){ const rows=(text||"").split(/\r?\n/).map(r=>r.trim()).filter(Boolean); const d=loadDB(); const byPhone=new Map((d.customers||[]).map(c=>[c.phone,c])); let n=0;
  rows.forEach((row,i)=>{ const c=row.split(",").map(s=>s.trim()); if(i===0 && /name/i.test(c[0]) && /phone/i.test(c[1]||"")) return; const phone=c[1]; if(!phone) return;
    const cust=byPhone.get(phone)||{phone}; cust.name=c[0]||cust.name; if(c[2]!==undefined&&c[2]!=="") cust.points=Number(c[2])||0; if(c[3]!==undefined&&c[3]!=="") cust.gift=Number(c[3])||0; if(c[4]!==undefined&&c[4]!=="") cust.balance=Number(c[4])||0; byPhone.set(phone,cust); n++; });
  d.customers=[...byPhone.values()]; saveDB(d); return n; }
function slug(){ return (FLOW.branding.name||"custompos").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }
function restoreBackup(text){ const obj=JSON.parse(text); const db=obj&&obj.data?obj.data:obj; if(!db||!Array.isArray(db.records)) throw new Error("not a customPOS backup"); persistDB(db); }
// install-as-app: brand the manifest + theme with the business so "Add to Home Screen" shows the shop's name/color
let __installReady=false;
function setupInstall(){
  if(__installReady) return; __installReady=true;
  const name=FLOW.branding.name||"customPOS", color=FLOW.branding.brandColor||"#1f6feb";
  const tc=document.getElementById("themeColor"); if(tc) tc.content=color;
  const at=document.createElement("meta"); at.name="apple-mobile-web-app-title"; at.content=name; document.head.appendChild(at);
  const letter=(name.trim()[0]||"C").toUpperCase();
  const svg="<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512'><rect width='512' height='512' rx='96' fill='"+color+"'/><text x='256' y='352' font-family='sans-serif' font-size='300' font-weight='bold' fill='#fff' text-anchor='middle'>"+letter+"</text></svg>";
  const icon="data:image/svg+xml,"+encodeURIComponent(svg);
  const manifest={ name, short_name:name.slice(0,12), display:"standalone", start_url:".", background_color:"#0f1115", theme_color:color, icons:[{src:icon, sizes:"any", type:"image/svg+xml"}] };
  const link=document.createElement("link"); link.rel="manifest"; link.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"})); document.head.appendChild(link);
  const ai=document.createElement("link"); ai.rel="apple-touch-icon"; ai.href=icon; document.head.appendChild(ai);
}
// brand color → the whole accent; a light brand gets dark ink for contrast (WCAG-ish luminance test)
function hexToRgb(h){ h=(h||"").replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16); return isNaN(n)?null:[(n>>16)&255,(n>>8)&255,n&255]; }
function readableInk(hex){ const c=hexToRgb(hex); if(!c) return "#ffffff"; const L=(0.299*c[0]+0.587*c[1]+0.114*c[2])/255; return L>0.62?"#111418":"#ffffff"; }
function applyBranding(){
  const color=FLOW.branding.brandColor||"#1f6feb"; const rs=document.documentElement.style;
  rs.setProperty('--brand', color); rs.setProperty('--brand-ink', readableInk(color));
  const c=hexToRgb(color); if(c) rs.setProperty('--brand-tint','rgba('+c[0]+','+c[1]+','+c[2]+',.13)');
  const logo=FLOW.branding.logo, li=document.getElementById('brandLogo'), dot=document.getElementById('brandDot');
  if(logo){ li.src=logo; li.style.display='block'; dot.style.display='none'; }
  else { li.style.display='none'; dot.style.display='inline-flex'; dot.style.background=color; dot.textContent=((FLOW.branding.name||'C').trim()[0]||'C').toUpperCase(); }
  document.getElementById("bizName").textContent = FLOW.branding.name;
}
function render(){
  DB = loadDB();
  setupInstall();
  applyBranding();
  const station = boundStation();
  document.getElementById("stationLabel").textContent = station ? "· "+station.label : "";
  const chg = document.getElementById("changeStation"); chg.style.display = station ? "" : "none"; chg.onclick = unbind;
  const app = document.getElementById("app"); app.innerHTML = "";
  if(!station){ renderPicker(app); return; }
  if(station.type==="intake")           renderIntake(app, station);
  else if(station.type==="production" || station.type==="staging") renderPipeline(app, station);
  else if(station.type==="fulfillment") renderCheckout(app, station);
  else if(station.type==="central"){ renderIntake(app, station); renderCheckout(app, station); }
  else if(station.type==="board")       renderBoard(app, station);
  else if(station.type==="tracker")     renderTracker(app, station);
  else if(station.type==="report")      renderReport(app, station);
  else if(station.type==="detail")      renderDetail(app, station);
  else if(station.type==="route")       renderRoute(app, station);
  else if(station.type==="timeclock")   renderTimeclock(app, station);
  else if(station.type==="booking")     renderBooking(app, station);
  else if(station.type==="kds")         renderKDS(app, station);
  else if(station.type==="floor")       renderFloor(app, station);
  else if(station.type==="schedule")    renderSchedule(app, station);
  else if(station.type==="worker")      renderWorker(app, station);
}

/* TIP POOLING — pooled tips shared fairly by hours worked (opt-in). Helps tipped hourly staff split evenly.
   On when FLOW.endpoints.payment.tipPool (or .tip.pool). Distribution is by each worker's recorded hours. */
function tipPoolOn(){ const pay=FLOW.endpoints&&FLOW.endpoints.payment; return !!(pay && (pay.tipPool || (pay.tip&&pay.tip.pool))); }
function poolHours(){ const by={}; let tot=0; (DB.punches||[]).forEach(pn=>{ const h=workedMs(pn)/3600000; by[pn.name]=(by[pn.name]||0)+h; tot+=h; }); return {by, tot}; }
function tipsForDay(day){ return DB.records.filter(r=>(r.status==="PAID"||r.status==="CLOSED") && dayOf(r.ts)===day).reduce((s,r)=>s+(r.tip||0),0); }
function tipShareFor(name, day){ const t=tipsForDay(day); const {by,tot}=poolHours(); return (!tot||!t)?0:t*(by[name]||0)/tot; }

/* WIN-BACK — regulars we haven't seen in a while. Bringing a lapsed customer back is cheaper than finding a new
   one; this surfaces them so the owner can invite them in one tap (over the notify seam). */
function winbackDays(){ return (FLOW.endpoints && FLOW.endpoints.winback && +FLOW.endpoints.winback.days) || 30; }
function customerLastVisit(phone){ let mx=0; DB.records.forEach(r=>{ if(r.customer && r.customer.phone===phone && (r.ts||0)>mx) mx=r.ts; }); return mx; }
function lapsedCustomers(){ const cut=Date.now()-winbackDays()*86400000; return (DB.customers||[]).map(c=>({c, last:customerLastVisit(c.phone)})).filter(x=>x.last>0 && x.last<cut).sort((a,b)=>a.last-b.last); }

/* COMMISSION & TIPS report — money-math primitive: per-performer service sales, commission %, tips */
/* ===================================== ROLES + MONEY-GATE (optional) =====================================
   Money-reversing / discretionary actions (refund, return) can require a manager/owner approval. Opt-in via
   FLOW.endpoints.approvals = { refund:true } together with FLOW.staff roles (role "owner"|"manager" may
   approve). Inert when unconfigured — a shop with no approver roles keeps the plain actions. The approver
   enters their PIN at the moment of the action; every approval is written to an audit log (DB.approvals).
   Generalizes "staff requests, owner approves" — the anti-theft gate — with no per-trade code. */
function approvers(){ return (FLOW.staff||[]).filter(s=> s.role==="owner" || s.role==="manager"); }
function needsApproval(action){ return !!(FLOW.endpoints && FLOW.endpoints.approvals && FLOW.endpoints.approvals[action]) && approvers().length>0; }
function withApproval(action, label, fn){
  if(!needsApproval(action)){ fn(null); render(); return; }
  const pin = prompt(label + "\nEnter a manager/owner PIN to approve this " + action + ":");
  if(pin==null) return;                                  // cancelled — no change
  const who = approvers().find(s=> String(s.pin)===String(pin));
  if(!who){ flash("Not authorized — a manager or owner PIN is required"); return; }
  fn(who);
  DB=loadDB(); DB.approvals=DB.approvals||[]; DB.approvals.push({ action, label, by:who.name, at:new Date().toISOString().slice(11,16), ts:Date.now() }); saveDB(DB);
  logActivity("admin", action+" approved — "+(label||"")+" (by "+who.name+")");
  render();
}
/* EXPENSES — the other half of the money story. Sales, cost-of-goods and labor were already captured; this
   adds the overhead an owner actually pays (supplies, rent, utilities…) so the report goes all the way to NET
   profit instead of stopping at gross margin. Append-only + void (never a hard delete, per the house rule),
   and every entry lands on the activity log like any other money edit. NOTE: entered on the office/report
   station; syncing the expense ledger across stations is a follow-up (the hub syncs orders + customers today). */
const EXPENSE_CATS=["supplies","rent","utilities","equipment","fees","other"];
function expenseCats(){ return (FLOW.expenses&&FLOW.expenses.categories)||EXPENSE_CATS; }
function dayExpenses(day){ return (DB.expenses||[]).filter(e=>!e.void && e.day===day); }
function dayExpenseTotal(day){ return dayExpenses(day).reduce((s,e)=>s+(+e.amount||0),0); }
function addExpense(amount, category, vendor, note){
  amount=+amount; if(!(amount>0)) return false;
  DB=loadDB(); DB.expenses=DB.expenses||[];
  DB.expenses.push({ id:"E"+Date.now(), ts:Date.now(), day:todayStr(), category:category||"other", vendor:(vendor||"").trim(), note:(note||"").trim(), amount:+amount.toFixed(2), emp:(typeof actingStaff==="function"?actingStaff():"") });
  logActivity("money", "expense · "+(category||"other")+((vendor||"").trim()?" · "+vendor.trim():""), null, amount);
  saveDB(DB); return true;
}
function voidExpense(id){ DB=loadDB(); const e=(DB.expenses||[]).find(x=>x.id===id); if(e && !e.void){ e.void=true; logActivity("money", "voided expense · "+(e.category||"other"), null, e.amount); saveDB(DB); } }
// labor cost for a day, from the punch clock × each person's wage (the same basis the day verdict uses)
function dayLaborCost(){ let c=0; (DB.punches||[]).forEach(pn=>{ c += (workedMs(pn)/3600000)*((pn.wage!=null?pn.wage:staffWage(pn.staffId))||0); }); return c; }

function renderReport(app, station){
  const day = reportDay || todayStr(); const isToday = day===todayStr();

  // day navigation — the report defaults to today but you can page back through history
  const nav=document.createElement("div"); nav.className="row"; nav.style.margin="0 0 10px";

  const dp=document.createElement("input"); dp.type="date"; dp.value=day; dp.style.margin="0 8px"; dp.max=todayStr(); dp.onchange=e=>{ reportDay = e.target.value||todayStr(); render(); }; nav.appendChild(dp);

  app.appendChild(nav);

    // ---- MAKE IT YOURS (first) — a shop's logo + brand color, so the whole app looks like THEIR brand ----

    let logoData = FLOW.branding.logo||null;

    const logoLab=document.createElement("span"); logoLab.className="flab"; logoLab.textContent="Logo"; logoLab.style.cssText="display:inline-block;min-width:190px;color:var(--dim)"; logoRow.appendChild(logoLab);
    const prev=document.createElement("img"); prev.style.cssText="height:34px;max-width:120px;border-radius:6px;object-fit:contain;border:1px solid var(--line)"+(logoData?"":";display:none"); if(logoData) prev.src=logoData; logoRow.appendChild(prev);

    const rm=document.createElement("button"); rm.textContent="Remove"; rm.style.margin="0 0 0 8px"; rm.onclick=()=>{ logoData=null; prev.style.display="none"; file.value=""; }; logoRow.appendChild(rm);
    grid.appendChild(logoRow);
    const color=document.createElement("input"); color.type="color"; color.value=FLOW.branding.brandColor||"#1f6feb"; field("Brand color", color);
    const biz=document.createElement("input"); biz.type="text"; biz.value=FLOW.branding.name||""; biz.style.width="200px"; field("Business name", biz);
    const rate=document.createElement("input"); rate.type="number"; rate.step="0.01"; rate.value=((+t.rate||0)*100).toFixed(2); rate.style.width="90px"; field("Sales tax rate (%)", rate);
    const incl=document.createElement("input"); incl.type="checkbox"; incl.checked=!!t.included; field("Tax included in prices", incl);
    const tips=document.createElement("input"); tips.type="text"; tips.value=(tip.presets||[]).join(", "); tips.placeholder="15, 18, 20"; tips.style.width="120px"; field("Tip presets (%)", tips);
    const lab=document.createElement("input"); lab.type="number"; lab.value=(FLOW.labor&&FLOW.labor.targetLaborPct)||""; lab.placeholder="28"; lab.style.width="90px"; field("Target labor (% of sales)", lab);
    const save=document.createElement("button"); save.className="primary"; save.textContent="Save settings"; save.style.marginTop="8px";
    save.onclick=()=>{ const presets=tips.value.split(",").map(x=>+x.trim()).filter(x=>x>0);
      saveSettings({ bizName:(biz.value||"").trim()||FLOW.branding.name,
                     brandColor:color.value, logo:logoData,
                     tax:{ rate:Math.max(0,(+rate.value||0)/100), included:!!incl.checked },
                     tipPresets:presets.length?presets:undefined,
                     targetLaborPct: lab.value!==""?+lab.value:undefined });
      flash("Settings saved"); render(); };
    grid.appendChild(save); det.appendChild(grid); app.appendChild(det);
  }
  const dayAll=DB.records.filter(r=>(r.status==="PAID"||r.status==="CLOSED"||r.status==="REFUNDED") && dayOf(r.ts)===day);
  // multi-store: scope the whole report to one store, with an all-stores roll-up when viewing "All"
  if(storesOn()){
    const chips=document.createElement("div"); chips.className="opts"; chips.style.margin="0 0 10px";
    const mk=(id,label)=>{ const b=document.createElement("button"); if((reportStore||"")===(id||"")) b.className="sel"; b.textContent=label; b.onclick=()=>{ reportStore=id; render(); }; chips.appendChild(b); };
    mk(null,"All stores"); storeList().forEach(s=>mk(s.id, s.name)); app.appendChild(chips);
    if(!reportStore){   // roll-up: net sales + orders per store (only when more than one store rang today)
      const per={}; dayAll.filter(r=>r.status!=="REFUNDED").forEach(r=>{ const sid=r.storeId||"—"; const allSub=lineSubtotal(r), frac=allSub>0?(allSub-returnedSubtotal(r))/allSub:1; per[sid]=per[sid]||{net:0,orders:0}; per[sid].net+=recordNet(r)*frac; per[sid].orders++; });
      const ids=Object.keys(per);
      if(ids.length>1){ const rc=document.createElement("div"); rc.className="card"; rc.innerHTML="<div class='row'><b>By store</b> <span class='muted'>net sales "+(isToday?"today":day)+"</span></div>";
        let tot=0, to=0; ids.sort((a,b)=>per[b].net-per[a].net).forEach(sid=>{ tot+=per[sid].net; to+=per[sid].orders; const row=document.createElement("div"); row.className="line"; row.innerHTML="<span>🏬 "+(storeName(sid)||sid)+" <span class='muted'>· "+per[sid].orders+" order(s)</span></span><span class='spacer'></span><span>"+money(per[sid].net)+"</span>"; rc.appendChild(row); });
        const t=document.createElement("div"); t.className="line"; t.innerHTML="<b>All stores</b> <span class='muted'>· "+to+" order(s)</span><span class='spacer'></span><b>"+money(tot)+"</b>"; rc.appendChild(t); app.appendChild(rc); }
    }
  }
  const done = (storesOn() && reportStore) ? dayAll.filter(r=>r.storeId===reportStore) : dayAll;
  const L=(lab,val,bold)=>"<div class='line'>"+(bold?"<b>":"<span>")+lab+(bold?"</b>":"</span>")+"<span class='spacer'></span>"+(bold?"<b>":"<span>")+val+(bold?"</b>":"</span>")+"</div>";
  // ---- daily sales summary (refund-aware: a refunded order's sale nets out, its reversed tender nets its tenders) ----
  let net=0, tax=0, tips=0, disc=0, items=0, refunds=0, orders=0, cogs=0, roundUp=0, comps=0; const byTender={}, byCat={}, byItem={}, byHour={};
  const itemCost=(l)=>{ const it=FLOW.catalog.find(i=>i.id===l.catId); return (it&&+it.cost)||0; };
  done.forEach(r=>{ const rf=r.status==="REFUNDED";
    if(rf){ refunds += recordTotal(r); }
    else { orders++;
      const allSub=lineSubtotal(r), frac = allSub>0 ? (allSub-returnedSubtotal(r))/allSub : 1;   // proportion still sold (line-level returns)
      net += recordNet(r)*frac; tax += recordTax(r)*frac; tips += r.tip||0; disc += recordDiscount(r)*frac; roundUp += r.roundUp||0;
      if(r.ts){ const hr=new Date(r.ts).getHours(); byHour[hr]=(byHour[hr]||0)+recordNet(r)*frac; }
      r.lines.filter(l=>!l.returned).forEach(l=>{ items += l.qty; cogs += itemCost(l)*l.qty; byCat[l.category||"other"]=(byCat[l.category||"other"]||0)+l.price*l.qty;
        if(l.comped) comps += (l.comped.amount||0);   // 🎁 value given away as comps today
        const bi=byItem[l.name]=byItem[l.name]||{qty:0,rev:0,cost:0}; bi.qty+=l.qty; bi.rev+=l.price*l.qty; bi.cost+=itemCost(l)*l.qty; });
      const ret = -((r.tenders||[]).filter(t=>t.refund).reduce((s,t)=>s+t.amount,0)); if(ret>0.0001) refunds += ret;   // partial line returns
    }
    (r.tenders||[]).forEach(t=>{ byTender[t.type]=(byTender[t.type]||0)+t.amount; });   // refund pushes offsetting negative tenders, so this nets
  });
  const onAccount=byTender.account||0;   // charged to house accounts today — money owed, not money collected
  const collected=Object.keys(byTender).filter(k=>k!=="account").reduce((s,k)=>s+byTender[k],0);
  // ---- "how today went": one plain-language verdict fusing sales, margin, and labor — the first thing an owner sees ----
  if(isToday && (orders||refunds)){
    const laborCost=dayLaborCost();
    const haveCost=FLOW.catalog.some(i=>+i.cost>0); const marginPct = (haveCost&&net>0)? (net-cogs)/net*100 : null;
    const laborPct = (laborCost>0&&net>0)? laborCost/net*100 : null;
    const opEx=dayExpenseTotal(day); const netProfit = net - (haveCost?cogs:0) - laborCost - opEx;   // full picture: down to net
    const target=(FLOW.labor&&FLOW.labor.targetLaborPct)||30;
    const concerns=[]; if(laborPct!=null && laborPct>target+10) concerns.push("labor is running high"); if(marginPct!=null && marginPct<20) concerns.push("margins are thin"); if(refunds>collected*0.15 && refunds>0) concerns.push("lots of refunds"); if(netProfit<0 && (opEx>0||laborCost>0)) concerns.push("spending outran sales");
    const good = !concerns.length && net>0;
    const verdict = net<=0 ? "Quiet so far today." : good ? "Solid day." : "Worth a look — "+concerns.join(", ")+".";
    const bits=[money(collected)+" in"]; if(marginPct!=null) bits.push(marginPct.toFixed(0)+"% margin"); if(laborPct!=null) bits.push("labor "+laborPct.toFixed(0)+"% of sales"); if(opEx>0||laborCost>0) bits.push((netProfit>=0?"+":"−")+money(Math.abs(netProfit))+" net");
    const hd=document.createElement("div"); hd.className="card"; hd.style.cssText="border-left:4px solid "+(net<=0?"var(--line)":good?"var(--good,#2ea043)":"var(--warn,#c99a12)")+";padding-left:14px";
    hd.innerHTML="<div style='font-size:18px;font-weight:700'>"+verdict+"</div><div class='muted' style='margin-top:2px'>"+bits.join(" · ")+"</div>";
    app.appendChild(hd);
  }
  const sum=document.createElement("div"); sum.className="card";
  sum.innerHTML="<div class='row'><b>Sales summary</b></div>"
    + L("Orders", String(orders)) + L("Items sold", String(items))
    + L("Net sales", money(net)) + (disc?L("Discounts","−"+money(disc)):"") + (comps?L("Comps (on the house)","−"+money(comps)):"") + L("Tax collected", money(tax)) + (tips?L("Tips", money(tips)):"") + (refunds?L("Refunds","−"+money(refunds)):"")
    + L("Total collected", money(collected), true) + (onAccount?L("On account (A/R)", money(onAccount)):"");
  app.appendChild(sum);
  // 💸 tip-out by role — the payroll pain point. When configured, show each support role's cut of today's tips
  // (a % of tips) and what's left for the servers, so tip-out is spelled out at close instead of done by hand.
  const tipOut=(FLOW.endpoints.payment.tip&&FLOW.endpoints.payment.tip.tipOut)||null;
  if(tipOut && tipOut.length && tips>0.0001){
    let out=0; const rows=tipOut.map(t=>{ const cut=+(tips*(+t.pct||0)/100).toFixed(2); out+=cut; return L("→ "+(t.role||"support")+" ("+(+t.pct||0)+"%)","−"+money(cut)); }).join("");
    const toCard=document.createElement("div"); toCard.className="card";
    toCard.innerHTML="<div class='row'><b>Tip-out</b> <span class='muted'>from "+money(tips)+" in tips</span></div>"+rows+L("Kept by servers", money(+(tips-out).toFixed(2)), true);
    app.appendChild(toCard);
  }
  // ---- community: charity round-ups collected today (only when the round-up option is on) ----
  if(FLOW.endpoints.payment.roundUp && roundUp>0){ const cause=(FLOW.endpoints.payment.roundUp.cause)||"a local cause";
    const cc=document.createElement("div"); cc.className="card"; cc.innerHTML="<div class='row'><b>Community ♥</b></div>"+L("Rounded up for "+cause, money(roundUp), true)+"<div class='muted' style='margin-top:2px'>Collected from customers who chose to round up — set it aside to donate.</div>";
    app.appendChild(cc);
  }
  // ---- gross margin: what's left after the cost of what you sold (only when items carry a cost) ----
  if(FLOW.catalog.some(i=>+i.cost>0) && net>0){ const gross=net-cogs; const margin=gross/net*100;
    const pc=document.createElement("div"); pc.className="card";
    pc.innerHTML="<div class='row'><b>Gross margin</b></div>"+L("Net sales", money(net))+L("Cost of goods","−"+money(cogs))+L("Gross profit", money(gross), true)
      +"<div class='line'><span>Margin</span><span class='spacer'></span><span"+(margin<0?" style='color:var(--bad);font-weight:600'":"")+">"+margin.toFixed(0)+"%</span></div>"
      +"<div class='muted' style='margin-top:2px'>"+(margin<0?"You're selling below cost today — check pricing or waste.":"What's left to cover rent, labor, and everything else.")+"</div>";
    app.appendChild(pc);

  // ---- expenses: the overhead behind the counter (supplies, rent, utilities…), so the picture reaches NET profit ----
  const exList=dayExpenses(day), exTotal=dayExpenseTotal(day); const byExCat={}; exList.forEach(e=>{ byExCat[e.category||"other"]=(byExCat[e.category||"other"]||0)+(+e.amount||0); });
  const ex=document.createElement("div"); ex.className="card";
  const exHead=document.createElement("div"); exHead.innerHTML="<div class='row'><b>Expenses</b><span class='spacer'></span><span class='muted'>"+(isToday?"today":day)+"</span></div>"; ex.appendChild(exHead);
  if(isToday){   // entry form (built as DOM so its Add handler survives — never rebuild the card via innerHTML+= after this)
    const form=document.createElement("div"); form.className="row"; form.style.cssText="gap:6px;flex-wrap:wrap;margin:4px 0 8px";
    const amt=document.createElement("input"); amt.type="number"; amt.placeholder="$ amount"; amt.style.width="120px";
    const cat=document.createElement("select"); expenseCats().forEach(c=>{ const o=document.createElement("option"); o.value=c; o.textContent=c[0].toUpperCase()+c.slice(1); cat.appendChild(o); });
    const ven=document.createElement("input"); ven.type="text"; ven.placeholder="vendor / note"; ven.style.minWidth="140px";
    const add=document.createElement("button"); add.className="primary"; add.textContent="Add"; add.onclick=()=>{ if(addExpense(amt.value, cat.value, ven.value, "")) render(); else flash("Enter an amount"); };
    [amt,cat,ven,add].forEach(el=>form.appendChild(el)); ex.appendChild(form);
  }
  if(exList.length){
    const sumBox=document.createElement("div"); let sh="";
    Object.keys(byExCat).sort((a,b)=>byExCat[b]-byExCat[a]).forEach(k=>{ sh+=L(k[0].toUpperCase()+k.slice(1),"−"+money(byExCat[k])); });
    sh+=L("Total expenses","−"+money(exTotal), true); sumBox.innerHTML=sh; ex.appendChild(sumBox);
    const det=document.createElement("div"); det.style.marginTop="6px";
    exList.slice().sort((a,b)=>b.ts-a.ts).forEach(e=>{ const row=document.createElement("div"); row.className="line"; row.style.fontSize="13px";
      row.innerHTML="<span class='muted'>"+(e.category||"other")+(e.vendor?" · "+e.vendor:"")+"</span><span class='spacer'></span><span>"+money(e.amount)+"</span>";
      if(isToday){ const v=document.createElement("button"); v.textContent="void"; v.className="link"; v.style.marginLeft="8px"; v.onclick=()=>{ voidExpense(e.id); render(); }; row.appendChild(v); }
      det.appendChild(row); });
    ex.appendChild(det);
  } else { const none=document.createElement("div"); none.className="muted"; none.textContent="No expenses recorded"+(isToday?" yet — add supplies, rent, utilities as you pay them.":" that day."); ex.appendChild(none); }
  app.appendChild(ex);
  // ---- bottom line: the whole money story in one card — revenue all the way down to net profit (an estimate) ----
  if(net>0 || exTotal>0){
    const laborCost=dayLaborCost(); const haveCost=FLOW.catalog.some(i=>+i.cost>0);
    const gross=net-(haveCost?cogs:0); const netProfit=gross-laborCost-exTotal;
    const col=netProfit>=0?"var(--good,#2ea043)":"var(--bad,#e5484d)";
    const bl=document.createElement("div"); bl.className="card"; bl.style.cssText="border-left:4px solid "+col+";padding-left:14px";
    bl.innerHTML="<div class='row'><b>Bottom line</b><span class='spacer'></span><span class='muted'>"+(isToday?"today":day)+" · estimate</span></div>"
      +L("Net sales", money(net))
      +(haveCost?L("Cost of goods","−"+money(cogs)):"")
      +L("Gross profit", money(gross))
      +(laborCost>0?L("Labor","−"+money(laborCost)):"")

  bk.appendChild(fileBtn("⬆ Import customers (CSV)", "importCustFile", ".csv,text/csv", txt=>{ const n=importCustomersCSV(txt); flash(n?("Imported "+n+" customer"+(n>1?"s":"")):"No rows imported"); render(); }));
  app.appendChild(bk);
}

/* TIME CLOCK — staff punch in/out by PIN, then a welcome screen (daily message + specials + encouragement).
   v0.44 adds worker-rights Phase 2: unpaid BREAKS (start/end), REAL-TIME EARNINGS while on shift, and a
   worker-protective BREAK-RULES engine (meal/rest reminders surfaced by default; operators tune, they don't
   silently remove). Config: FLOW.staff [{id,name,pin,wage?}], optional FLOW.welcome {message,specials:[...]},
   optional FLOW.labor {mealAfterHrs,mealMins,restEveryHrs,restMins}. Punches land in DB.punches. */
const CLOCK_CHEERS = ["Have a great shift!","You've got this.","Thanks for being here.","Let's make it a good one.","The team's glad you're on today."];
// worker-protective defaults — a shop that configures nothing still reminds workers of their breaks
const LABOR_DEFAULTS = { mealAfterHrs:5, mealMins:30, restEveryHrs:4, restMins:10 };
function laborRules(){ return Object.assign({}, LABOR_DEFAULTS, (FLOW.labor)||{}); }
const nowHM = () => new Date().toTimeString().slice(0,5);   // local HH:MM (matches the wall clock the worker sees)
function openPunch(staffId){ return (DB.punches||[]).find(p=>p.staffId===staffId && !p.out); }
function onBreak(p){ return !!(p && (p.breaks||[]).some(b=>!b.end)); }
function curBreak(p){ return p && (p.breaks||[]).find(b=>!b.end); }
function breakMs(p){ const now=Date.now(); return (p.breaks||[]).reduce((s,b)=> s + ((b.end?b.endTs:now)-b.startTs), 0); }
function workedMs(p){ const now=Date.now(); return Math.max(0, ((p.out?p.outTs:now)-p.inTs) - breakMs(p)); }  // paid time = clocked minus unpaid breaks
function hoursToday(staffId){ return (DB.punches||[]).filter(p=>p.staffId===staffId).reduce((s,p)=> s + workedMs(p), 0)/3600000; }
function staffWage(staffId){ const s=(FLOW.staff||[]).find(x=>x.id===staffId); return (s&&+s.wage)||0; }
function earnedToday(staffId){ return hoursToday(staffId) * staffWage(staffId); }
// worker-protective reminder: due a meal break once past mealAfterHrs with none taken yet
function breakDue(p){ if(!p) return null; const r=laborRules(); if(onBreak(p)) return null;
  const worked=workedMs(p)/3600000;
  const tookMeal=(p.breaks||[]).some(b=> b.end && (b.endTs-b.startTs)/60000 >= r.mealMins*0.6 );
  if(r.mealAfterHrs && worked>=r.mealAfterHrs && !tookMeal)
    return "You've worked "+worked.toFixed(1)+" h — you're due a "+r.mealMins+"-minute meal break.";
  const anyBreak=(p.breaks||[]).length>0;   // a rest break after a stretch with none at all
  if(r.restEveryHrs && worked>=r.restEveryHrs && !anyBreak)
    return "You've been on "+worked.toFixed(1)+" h without a break — take a "+r.restMins+"-minute breather.";
  return null;
}
// --- worker safety: file an incident / injury report, or a panic "get help now" alert (rides the notify seam) ---
const INCIDENT_TYPES = ["Injury","Safety hazard","Harassment","Near miss","Other"];
function incidentTypes(){ return (FLOW.safety && FLOW.safety.types) || INCIDENT_TYPES; }
function openIncidents(){ return (DB.incidents||[]).filter(i=>!i.ack); }
function ackIncident(id){ DB=loadDB(); const i=(DB.incidents||[]).find(x=>x.id===id); if(i) i.ack=true; saveDB(DB); render(); }
function fileIncident(staff, type, note, urgent){ DB=loadDB(); DB.incidents=DB.incidents||[];
  const rec={ id:"I"+Date.now(), staffId:staff?staff.id:null, name:staff?staff.name:"(unknown)", type, note:note||"", urgent:!!urgent, ts:Date.now(), at:nowHM(), day:todayStr(), ack:false };
  DB.incidents.push(rec);
  const phone=FLOW.safety && FLOW.safety.alertPhone;   // alert a manager if configured — never blocks the record
  if(phone && FLOW.endpoints && FLOW.endpoints.notify){ try{ notifyAdapter().send(phone, (urgent?"🆘 HELP NOW — ":"⚠️ Incident — ")+rec.name+": "+type+(note?" — "+note:"")+" @ "+rec.at); }catch(e){} }
  incidentSent = urgent?"help":"filed"; saveDB(DB); render();
}
function clockIn(staff){ DB.punches.push({ staffId:staff.id, name:staff.name, in:nowHM(), inTs:Date.now(), out:null, outTs:null, breaks:[], wage:+staff.wage||0 }); clockWelcome={ name:staff.name, inbound:true, staffId:staff.id }; clockAction=null; pinBuf=""; saveDB(DB); logActivity("clock", staff.name+" clocked in"); render(); }
function clockOut(staff){ const p=openPunch(staff.id); if(!p) return; const b=curBreak(p); if(b){ b.end=nowHM(); b.endTs=Date.now(); } p.out=nowHM(); p.outTs=Date.now(); clockWelcome={ name:staff.name, inbound:false, staffId:staff.id }; clockAction=null; pinBuf=""; saveDB(DB); logActivity("clock", staff.name+" clocked out"); render(); }
function startBreak(staff){ const p=openPunch(staff.id); if(!p||onBreak(p)) return; p.breaks.push({ start:nowHM(), startTs:Date.now(), end:null, endTs:null }); saveDB(DB); render(); }
function endBreak(staff){ const p=openPunch(staff.id); const b=curBreak(p); if(!b) return; b.end=nowHM(); b.endTs=Date.now(); saveDB(DB); render(); }
function renderTimeclock(app, station){
  const staff=FLOW.staff||[];
  // keep real-time earnings ticking while anyone is on the clock (guarded to this station only)
  if(clockTimer){ clearInterval(clockTimer); clockTimer=null; }
  if(staff.some(s=>openPunch(s.id))) clockTimer=setInterval(()=>{ const st=boundStation(); if(st&&st.type==="timeclock") render(); }, 30000);
  // welcome / goodbye screen right after a punch
  if(clockWelcome){
    const w=clockWelcome; const wel=document.createElement("div"); wel.className="card"; wel.style.textAlign="center";
    const cheer=CLOCK_CHEERS[w.name.length % CLOCK_CHEERS.length];  // deterministic (no Math.random in the engine)
    if(w.inbound){
      wel.innerHTML="<h2 style='margin:6px 0'>👋 Welcome, "+w.name+"!</h2><div class='muted' style='margin-bottom:10px'>Clocked in at "+nowHM()+" · "+cheer+"</div>";
      const wc=FLOW.welcome||{};
      if(wc.message){ const m=document.createElement("div"); m.className="line"; m.style.justifyContent="center"; m.innerHTML="<span>"+wc.message+"</span>"; wel.appendChild(m); }
      if((wc.specials||[]).length){ const s=document.createElement("div"); s.style.marginTop="8px"; s.innerHTML="<b>Today's specials</b>"; (wc.specials||[]).forEach(sp=>{ const d=document.createElement("div"); d.className="muted"; d.textContent="• "+sp; s.appendChild(d); }); wel.appendChild(s); }
      const kus=w.staffId?kudosFor(w.staffId):[]; if(kus.length){ const k=kus[0]; const kd=document.createElement("div"); kd.style.cssText="margin-top:10px;background:#123a1e;color:#b6f0c6;border-radius:8px;padding:8px 10px"; kd.innerHTML="⭐ <b>"+k.from+"</b> says: "+k.note; wel.appendChild(kd); }
    } else {
      const wg=staffWage(w.staffId); const paid = wg? " · earned $"+earnedToday(w.staffId).toFixed(2):"";
      wel.innerHTML="<h2 style='margin:6px 0'>✅ Thanks, "+w.name+"!</h2><div class='muted' style='margin-bottom:10px'>Clocked out · "+hoursToday(w.staffId).toFixed(2)+" h today"+paid+". See you next time.</div>";
    }
    const ok=document.createElement("button"); ok.className="primary"; ok.textContent=w.inbound?"Start shift":"Done"; ok.onclick=()=>{ clockWelcome=null; render(); }; wel.appendChild(ok);
    app.appendChild(wel); return;
  }
  // on-shift action screen — break / clock out / live earnings (shown after a clocked-in worker enters their PIN)
  if(clockAction){
    const s=staff.find(x=>x.id===clockAction.staffId); const p=s&&openPunch(s.id);
    if(!s||!p){ clockAction=null; render(); return; }
    const card=document.createElement("div"); card.className="card";
    card.innerHTML="<h2 style='margin:2px 0'>Hi "+s.name+"</h2><div class='muted'>On since "+p.in+" · "+(workedMs(p)/3600000).toFixed(2)+" h worked"+(breakMs(p)? " · "+(breakMs(p)/60000).toFixed(0)+" min on break":"")+"</div>";
    if(staffWage(s.id)){ const e=document.createElement("div"); e.className="line"; e.style.fontSize="18px"; e.innerHTML="<span>Earned this shift</span><span class='spacer'></span><b>$"+earnedToday(s.id).toFixed(2)+"</b>"; e.title="at $"+staffWage(s.id).toFixed(2)+"/h"; card.appendChild(e); }
    const due=breakDue(p); if(due){ const d=document.createElement("div"); d.className="line"; d.style.cssText="background:#5a3a12;color:#ffdca8;border-radius:6px;padding:8px;margin-top:6px"; d.textContent="⏰ "+due; card.appendChild(d); }
    const btns=document.createElement("div"); btns.style.cssText="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px";
    if(onBreak(p)){ const b=curBreak(p); const eb=document.createElement("button"); eb.className="primary"; eb.textContent="End break (since "+b.start+")"; eb.onclick=()=>endBreak(s); btns.appendChild(eb); }
    else { const sb=document.createElement("button"); sb.textContent="Start break"; sb.onclick=()=>startBreak(s); btns.appendChild(sb); }
    const co=document.createElement("button"); co.textContent="Clock out"; co.style.background="var(--bad)"; co.style.color="#fff"; co.onclick=()=>clockOut(s); btns.appendChild(co);
    const back=document.createElement("button"); back.textContent="Back"; back.onclick=()=>{ clockAction=null; render(); }; btns.appendChild(back);
    card.appendChild(btns);
    // worker safety — file an incident, or a panic "get help now" alert (identified worker)
    const safe=document.createElement("div"); safe.style.cssText="margin-top:12px;border-top:1px solid var(--line);padding-top:10px";
    if(incidentSent){ safe.innerHTML = incidentSent==="help"
        ? "<div style='color:#ffb3b3'><b>🆘 Help is on the way.</b> Your alert was sent"+((FLOW.safety&&FLOW.safety.alertPhone)?" to a manager":"")+" and logged.</div>"
        : "<div class='muted'>✓ Incident filed and logged. Thank you for reporting.</div>";
      const okb=document.createElement("button"); okb.textContent="OK"; okb.style.marginTop="6px"; okb.onclick=()=>{ incidentSent=null; render(); }; safe.appendChild(okb);
    } else {
      const lab=document.createElement("div"); lab.className="muted"; lab.style.marginBottom="4px"; lab.textContent="Safety"; safe.appendChild(lab);
      const sel=document.createElement("select"); sel.id="incType"; incidentTypes().forEach(t=>{ const o=document.createElement("option"); o.value=t; o.textContent=t; sel.appendChild(o); }); sel.style.marginRight="8px"; safe.appendChild(sel);
      const note=document.createElement("input"); note.id="incNote"; note.placeholder="what happened (optional)"; note.style.cssText="max-width:200px;margin-right:8px"; safe.appendChild(note);
      const file=document.createElement("button"); file.textContent="File report"; file.onclick=()=>fileIncident(s, sel.value, note.value, false); safe.appendChild(file);
      const panic=document.createElement("button"); panic.textContent="🆘 Get help now"; panic.style.cssText="background:var(--bad);color:#fff;margin-left:8px"; panic.onclick=()=>fileIncident(s, "Help — urgent", note.value, true); safe.appendChild(panic);
    }
    card.appendChild(safe); app.appendChild(card); return;
  }
  app.innerHTML="<h2>"+station.label+"</h2><p class='muted'>Enter your PIN to clock in, take a break, or clock out.</p>";
  if(!staff.length){ const e=document.createElement("div"); e.className="empty card"; e.textContent="No staff configured. Add staff (name + PIN) in the builder."; app.appendChild(e); return; }
  // PIN pad
  const pad=document.createElement("div"); pad.className="card"; pad.style.maxWidth="260px";
  const disp=document.createElement("div"); disp.style.cssText="font-size:28px;letter-spacing:8px;text-align:center;min-height:36px;margin-bottom:8px"; disp.textContent=pinBuf.replace(/./g,"•")||"—"; pad.appendChild(disp);
  const grid=document.createElement("div"); grid.style.cssText="display:grid;grid-template-columns:repeat(3,1fr);gap:6px";
  const press=d=>{ pinBuf=(pinBuf+d).slice(0,8); render(); };
  ["1","2","3","4","5","6","7","8","9"].forEach(d=>{ const b=document.createElement("button"); b.textContent=d; b.onclick=()=>press(d); grid.appendChild(b); });
  const clr=document.createElement("button"); clr.textContent="⌫"; clr.onclick=()=>{ pinBuf=pinBuf.slice(0,-1); render(); }; grid.appendChild(clr);
  const zero=document.createElement("button"); zero.textContent="0"; zero.onclick=()=>press("0"); grid.appendChild(zero);
  const ent=document.createElement("button"); ent.className="primary"; ent.textContent="✓"; ent.onclick=()=>{ const who=staff.find(s=>String(s.pin)===pinBuf); if(who){ if(openPunch(who.id)){ clockAction={staffId:who.id}; pinBuf=""; render(); } else clockIn(who); } else { pinBuf=""; flash("PIN not recognized"); render(); } }; grid.appendChild(ent);
  pad.appendChild(grid); app.appendChild(pad);
  // who's on the clock — with live hours, break state, and (if waged) earnings
  const on=staff.filter(s=>openPunch(s.id));
  const oc=document.createElement("div"); oc.className="card"; oc.innerHTML="<div class='row'><b>On the clock</b></div>";
  if(!on.length){ const e=document.createElement("div"); e.className="muted"; e.textContent="Nobody clocked in."; oc.appendChild(e); }
  on.forEach(s=>{ const p=openPunch(s.id); const br=onBreak(p)?" · <span style='color:var(--warn,#c99a12)'>on break</span>":""; const wg=staffWage(s.id)?" · $"+earnedToday(s.id).toFixed(2):"";
    const row=document.createElement("div"); row.className="line"; row.innerHTML="<span>"+s.name+"</span><span class='spacer'></span><span class='muted'>in "+p.in+" · "+hoursToday(s.id).toFixed(2)+" h"+br+wg+"</span>"; oc.appendChild(row); });
  app.appendChild(oc);
}

/* APPOINTMENTS — book a customer + service + time; check-in turns a booking into a real order in the pipeline.
   Bookings live in DB.bookings; services are the catalog items. Staff options come from FLOW.staff/performers. */
let bookForm = { name:"", service:"", time:"", staff:"" };
function providerNames(){ return (FLOW.performers) || (FLOW.staff||[]).map(s=>s.name); }
function checkInBooking(bk){
  DB=loadDB(); DB.seq++;
  const item=FLOW.catalog.find(i=>i.id===bk.service);
  const line={ id:"L"+DB.seq, catId:item.id, name:item.name, modLabel:"", flags:[], performer:bk.staff||null, price:item.price, qty:1, category:item.category, path:(item.path||[]).slice(), stage:0 };
  const rec={ id:"R"+DB.seq, number:DB.seq, lines:[line], tenders:[], createdAt:new Date().toISOString().slice(11,16), ts:Date.now(), fromBooking:bk.id };
  if(bk.name){ rec.customer={ name:bk.name, phone:bk.phone||"" }; }
  if(storesOn()) rec.storeId = homeStore() || defaultStoreId();
  rec.status = allComplete(rec) ? "READY" : "INPROGRESS";
  DB.records.push(rec);
  const b=(DB.bookings||[]).find(x=>x.id===bk.id); if(b){ b.status="CHECKEDIN"; b.orderNo=rec.number; }
  saveDB(DB); render();
}
function renderBooking(app, station){
  app.innerHTML="<h2>"+station.label+"</h2>";
  const services=FLOW.catalog;
  // booking form
  const f=document.createElement("div"); f.className="card"; f.innerHTML="<div class='row'><b>New appointment</b></div>";

  const time=document.createElement("input"); time.id="bkTime"; time.type="time"; time.value=bookForm.time; time.oninput=e=>bookForm.time=e.target.value;

  const add=document.createElement("button"); add.className="primary"; add.textContent="Book it"; add.style.marginTop="8px";
  add.onclick=()=>{ if(!bookForm.service||!bookForm.time){ flash("Pick a service and a time"); return; } DB=loadDB(); DB.bookings.push({ id:"B"+Date.now(), name:bookForm.name, service:bookForm.service, time:bookForm.time, staff:bookForm.staff, status:"BOOKED" }); bookForm={ name:"", service:"", time:"", staff:"" }; saveDB(DB); render(); };
  f.appendChild(add); app.appendChild(f);

    const done=bk.status==="CHECKEDIN";
    row.innerHTML="<span><b>"+(bk.time||"—")+"</b> · "+(bk.name||"Guest")+" — "+item.name+(bk.staff?" <span class='pill'>"+bk.staff+"</span>":"")+(done?" <span class='pill clock good'>checked in #"+bk.orderNo+"</span>":"")+"</span><span class='spacer'></span>";
    if(!done){ const ci=document.createElement("button"); ci.className="good"; ci.textContent="Check in"; ci.style.padding="4px 10px"; ci.onclick=()=>checkInBooking(bk); row.appendChild(ci); }
    else { const cx=document.createElement("button"); cx.textContent="Remove"; cx.style.padding="4px 10px"; cx.onclick=()=>{ DB=loadDB(); DB.bookings=DB.bookings.filter(x=>x.id!==bk.id); saveDB(DB); render(); }; row.appendChild(cx); }
