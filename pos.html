/* KITCHEN DISPLAY (KDS) — interactive: live tickets with a prep timer that ages green→yellow→red, oldest first,
   and a Bump that fires the whole ticket ready. Thresholds from FLOW.kds {warnSec,badSec} (default 5/10 min). */
function kdsChip(r){
  const k=FLOW.kds||{warnSec:300,badSec:600}; const el=(Date.now()-(r.ts||Date.now()))/1000;
  const cls = el>=k.badSec ? "bad" : el>=k.warnSec ? "warn" : "good";
  return "<span class='pill clock "+cls+"'>"+fmtDur(el)+"</span>";
}
// bump only fires the released (current-course) lines; held courses wait until fired
function bumpRecord(r){ r.lines.forEach(l=>{ if(courseReleased(r,l)) l.stage=(l.path||[]).length; }); r.bumpedAt=new Date().toISOString().slice(11,16); afterChange(r); render(); }
/* ===================================== DELIVERY ROUTE (optional) =====================================
   A `route` station is a driver's manifest. Schedule stops (a customer, a day, pickup and/or delivery), then
   work them: "Picked up" opens an undetailed drop order for that customer (reusing quick-drop — detailed later
   at the plant); "Delivered" closes that customer's ready orders. Stops live in DB.stops (a top-level
   collection, like bookings). General — any business that runs a pickup/delivery route. Enabled by a route
   station; FLOW.route.days seeds the day chips. Inert without a route station. */
function renderRoute(app, station){
  DB=loadDB(); DB.stops=DB.stops||[];

  const days=(FLOW.route&&FLOW.route.days)||[];

  else { const di=document.createElement("input"); di.placeholder="day"; di.value=stopForm.day; di.oninput=e=>stopForm.day=e.target.value; f.appendChild(di); }
  const ks=document.createElement("select"); ["both","pickup","delivery"].forEach(k=>{ const o=document.createElement("option"); o.value=k; o.textContent=k; if(stopForm.kind===k)o.selected=true; ks.appendChild(o); }); ks.onchange=e=>stopForm.kind=e.target.value; f.appendChild(ks);
  const add=document.createElement("button"); add.className="primary"; add.textContent="Add stop"; add.style.marginLeft="8px";
  add.onclick=()=>{ if(!stopForm.phone&&!stopForm.name){ flash("Add a customer"); return; } DB=loadDB(); DB.stops=DB.stops||[]; DB.stops.push({ id:"S"+Date.now(), phone:(stopForm.phone||"").trim(), name:((stopForm.name||"").trim()||(stopForm.phone||"").trim()), address:(stopForm.address||"").trim(), day:stopForm.day, kind:stopForm.kind, status:"OPEN" }); stopForm={ phone:"",name:"",address:"",day:stopForm.day,kind:"both" }; saveDB(DB); render(); };
  f.appendChild(add); app.appendChild(f);
  // day filter
  if(days.length){ const bar=document.createElement("div"); bar.className="flowsel";
    const all=document.createElement("button"); if(!routeDay)all.className="sel"; all.textContent="All"; all.onclick=()=>{ routeDay=null; render(); }; bar.appendChild(all);
    days.forEach(d=>{ const bd=document.createElement("button"); if(routeDay===d)bd.className="sel"; bd.textContent=d; bd.onclick=()=>{ routeDay=d; render(); }; bar.appendChild(bd); }); app.appendChild(bar); }
  // manifest
  const stops=(DB.stops||[]).filter(s=> !routeDay || s.day===routeDay);
  if(!stops.length){ const e=document.createElement("div"); e.className="empty card"; e.textContent="No stops scheduled."; app.appendChild(e); }
  stops.forEach(s=>{ const c=document.createElement("div"); c.className="card";
    const ready=DB.records.filter(r=>(r.status==="READY"||r.status==="PAID") && r.customer && (s.phone? r.customer.phone===s.phone : r.customer.name===s.name));
    c.innerHTML="<div class='row'><b>"+s.name+"</b> <span class='pill'>"+s.kind+"</span>"+(s.day?" <span class='pill route'>"+s.day+"</span>":"")+"<span class='spacer'></span><span class='muted'>"+(s.address||"")+"</span></div>";
    const info=document.createElement("div"); info.className="muted"; info.style.margin="4px 0"; info.textContent= ready.length? (ready.length+" order(s) ready to deliver") : "no orders ready"; c.appendChild(info);
    if(s.kind!=="delivery" && !s.pickedUp){ const pu=document.createElement("button"); pu.className="good"; pu.textContent="✓ Picked up"; pu.onclick=()=>routePickup(s); c.appendChild(pu); }
    if(s.pickedUp){ const b=document.createElement("span"); b.className="pill clock good"; b.style.marginRight="8px"; b.textContent="picked up → #"+s.pickupOrder; c.appendChild(b); }
    if(s.kind!=="pickup"){ const dv=document.createElement("button"); dv.className="primary"; dv.style.marginLeft="8px"; dv.textContent=s.delivered?"delivered ✓":("Delivered ("+ready.length+")"); dv.disabled=s.delivered||!ready.length; dv.onclick=()=>routeDeliver(s, ready.map(r=>r.id)); c.appendChild(dv); }
    const rm=document.createElement("button"); rm.textContent="✕"; rm.title="Remove stop"; rm.style.cssText="margin-left:8px;padding:4px 10px"; rm.onclick=()=>{ DB=loadDB(); DB.stops=(DB.stops||[]).filter(x=>x.id!==s.id); saveDB(DB); render(); }; c.appendChild(rm);
    app.appendChild(c); });
}
function routePickup(s){
  DB=loadDB(); DB.seq++;
  const rec={ id:"R"+DB.seq, number:DB.seq, lines:[], tenders:[], createdAt:new Date().toISOString().slice(11,16), ts:Date.now(), undetailed:true, dropCount:0, fromRoute:s.id, status:"INPROGRESS", customer:{ name:s.name, phone:s.phone } };
  if(storesOn()) rec.storeId = storeForOrder(rec.customer);
  let c=DB.customers.find(x=>x.phone===s.phone); if(!c && s.phone){ c={ phone:s.phone, name:s.name }; DB.customers.push(c); } if(c && storesOn() && !c.storeId) c.storeId=rec.storeId;
  DB.records.push(rec);
  const st=(DB.stops||[]).find(x=>x.id===s.id); if(st){ st.pickedUp=true; st.pickupOrder=rec.number; }
  saveDB(DB); render();
}
function routeDeliver(s, ids){
  DB=loadDB(); (ids||[]).forEach(id=>{ const r=DB.records.find(x=>x.id===id); if(r){ r.status="CLOSED"; r.deliveredAt=new Date().toISOString().slice(11,16); } });
  const st=(DB.stops||[]).find(x=>x.id===s.id); if(st){ st.delivered=true; } saveDB(DB); render();
}
function renderKDS(app, station){
  app.innerHTML="<h2>"+station.label+"</h2><p class='muted'>Oldest first. Bump a ticket when it's up.</p>";
  const live=DB.records.filter(r=>r.status==="INPROGRESS").sort((a,b)=>(a.ts||0)-(b.ts||0));

    r.lines.filter(l=>courseReleased(r,l)).forEach(l=>{ const row=document.createElement("div"); row.className="line"; const where=lineComplete(l)?"ready":("at "+l.path[l.stage]);
      row.innerHTML="<span>"+l.qty+"× "+l.name+(l.modLabel?" <small class='mods'>"+l.modLabel+"</small>":"")+seatChip(l)+"</span><span class='spacer'></span><span class='muted'>"+where+"</span>"; c.appendChild(row); });
    // held courses waiting to be fired
    if(coursingOn()){ const held=r.lines.filter(l=>!courseReleased(r,l));
      if(held.length){ const h=document.createElement("div"); h.className="muted"; h.style.marginTop="4px"; h.textContent="held: "+held.map(l=>l.qty+"× "+l.name).join(", ")+" ("+courseLabel(fc+1)+")"; c.appendChild(h); } }
    const bump=document.createElement("button"); bump.className="primary"; bump.textContent="Bump ✓"; bump.style.marginTop="10px"; bump.onclick=()=>{ bumpRecord(r); saveDB(DB); render(); }; c.appendChild(bump);
    if(heldCourses(r)){ const fire=document.createElement("button"); fire.textContent="🔥 Fire "+courseLabel((r.firedCourse||1)+1); fire.style.margin="10px 0 0 8px"; fire.onclick=()=>fireNextCourse(r); c.appendChild(fire); }
    app.appendChild(c); });
}

/* ===================================== FLOOR / TABLE STATE MACHINE =====================================
   A spatial primitive: tables (or salon chairs, auto bays, spa rooms) that move through states over time.
   Config: FLOW.floor { label, sections?, warnSec?, states?[{id,label,color,next}], tables:[{id,label,seats,section}] }.
   Table state + since-timestamp live in DB.tables; the default state list is the restaurant service flow. */
const FLOOR_STATES = [
  { id:"empty",    label:"Empty",    color:"#5b6675", next:"assigned" },
  { id:"assigned", label:"Seated",   color:"#c99a12", next:"greeted"  },
  { id:"greeted",  label:"Greeted",  color:"#2f7bd6", next:"ordered"  },
  { id:"ordered",  label:"Ordered",  color:"#1f5fb0", next:"food"     },
  { id:"food",     label:"Food out", color:"#2ea043", next:"check"    },
  { id:"check",    label:"Check",    color:"#c9711f", next:"paid"     },
  { id:"paid",     label:"Paid",     color:"#9a5314", next:"bussing"  },
  { id:"bussing",  label:"Bussing",  color:"#6f42c1", next:"empty"    }
];
function floorStates(){ return (FLOW.floor && FLOW.floor.states) || FLOOR_STATES; }
function floorStateById(id){ return floorStates().find(s=>s.id===id) || floorStates()[0]; }
function tableRec(t){ const r=(DB.tables||{})[t.id]; return { state:(r&&r.state)||floorStates()[0].id, since:(r&&r.since)||null, seatedTs:(r&&r.seatedTs)||null, server:(r&&r.server)||null }; }
// 🧑‍🍳 server assignment: which server owns a table, and the "my tables" view.
function tableServer(id){ const r=(DB.tables||{})[id]; return (r&&r.server)||null; }
function serverStaff(){ return (FLOW.staff||[]); }   // any staff member can own tables
function assignServer(id, name){ DB=loadDB(); DB.tables=DB.tables||{}; const prev=DB.tables[id]||{ state:floorStates()[0].id, since:Date.now() };
  DB.tables[id]=Object.assign({}, prev, { server:(name||null) }); saveDB(DB);
  logActivity("access", (name?("table "+tableLabel(id)+" → "+name):("cleared server on table "+tableLabel(id)))); render(); }
// state change also drives turn-time analytics: a "turn" runs from leaving Empty until returning to Empty
function setTableState(id, state){ DB=loadDB(); DB.tables=DB.tables||{}; DB.turns=DB.turns||[];
  const emptyId=floorStates()[0].id; const now=Date.now(); const prev=DB.tables[id]||{}; let seatedTs=prev.seatedTs||null;
  const wasEmpty=!prev.state || prev.state===emptyId;
  if(wasEmpty && state!==emptyId) seatedTs=now;                               // a table just got seated — turn begins
  if(state===emptyId){ if(seatedTs) DB.turns.push({ table:id, seatedTs, clearedTs:now, dur:now-seatedTs, day:todayStr() }); seatedTs=null; }  // cleared — turn ends, logged
  DB.tables[id]=Object.assign({}, prev, { state, since:now, seatedTs });      // keep the assigned server across state changes
  if(state===emptyId) delete DB.tables[id].server;                            // a cleared table is free again
  saveDB(DB); render();
}
// 🔀 TRANSFER / MERGE tables — move a table's open check(s) to another table. If the target is empty it's a
// transfer (party moved); if it already has a check it's a merge (two tables become one party). The source is
// then freed (its turn ends). Reuses setTableState so turn analytics and the server-clear stay consistent.
function moveTable(fromId, toId){ if(!toId || fromId===toId) return;
  DB=loadDB(); const moved=(DB.records||[]).filter(r=>r.tableId===fromId && r.status!=="CLOSED" && r.status!=="REFUNDED");
  if(!moved.length){ flash("No open check on "+tableLabel(fromId)); return; }
  moved.forEach(r=>{ r.tableId=toId; r._t=Date.now(); });
  DB.tables=DB.tables||{}; const src=DB.tables[fromId]||{}, tgt=DB.tables[toId]||{};
  const emptyId=floorStates()[0].id, occ=(floorStates()[1]||floorStates()[0]).id;
  const wasOccupied=(tgt.state && tgt.state!==emptyId);
  DB.tables[toId]=Object.assign({}, tgt, { state: wasOccupied?tgt.state:occ, since:Date.now(), seatedTs: tgt.seatedTs||src.seatedTs||Date.now(), server: tgt.server||src.server||null });
  saveDB(DB);
  logActivity("access", (wasOccupied?"merged ":"moved ")+tableLabel(fromId)+" → "+tableLabel(toId)+" ("+moved.length+" check"+(moved.length>1?"s":"")+")");
  selTable=toId; setTableState(fromId, emptyId);   // free the source (logs its turn, clears its server, saves + renders)
}
function tableSeats(id){ const t=((FLOW.floor&&FLOW.floor.tables)||[]).find(x=>x.id===id); return (t&&+t.seats)||0; }
function tableLabel(id){ const t=((FLOW.floor&&FLOW.floor.tables)||[]).find(x=>x.id===id); return (t&&(t.label||t.id))||id; }
// a check belongs to a table (restaurants): open orders tagged with tableId, and their running balance
function tableOpenOrders(id){ return DB.records.filter(r=>r.tableId===id && r.status!=="CLOSED" && r.status!=="REFUNDED"); }
function tableOpenTotal(id){ return tableOpenOrders(id).reduce((s,r)=>s+recordBalance(r),0); }
function turnsToday(){ return (DB.turns||[]).filter(x=>x.day===todayStr()); }
function turnStats(){ const ts=turnsToday(); const n=ts.length; return { n, avgMs:n?ts.reduce((s,x)=>s+x.dur,0)/n:0, covers:ts.reduce((s,x)=>s+tableSeats(x.table),0) }; }
/* 🕐 RESERVATIONS + WAITLIST — the host stand, run from the floor. Reservations are booked for a time today;
   the waitlist holds walk-ins with a quoted wait. Both can be "seated" (optionally onto the selected table) or
   cleared. Records are never hard-deleted — a reservation is cancelled, a waitlist party marked seated/left. */
function todayReservations(){ return (DB.reservations||[]).filter(r=>r.day===todayStr() && r.status!=="cancelled").sort((a,b)=>String(a.time||"").localeCompare(String(b.time||""))); }
function addReservation(name, party, time, phone){ name=(name||"").trim(); if(!name){ flash("Name for the reservation?"); return; }
  DB=loadDB(); DB.reservations=DB.reservations||[]; DB.reservations.push({ id:"RSV"+Date.now(), name, phone:(phone||"").trim(), party:Math.max(1,+party||1), time:(time||"").trim(), day:todayStr(), status:"booked" });
  logActivity("access","reservation · "+name+" ×"+(Math.max(1,+party||1))+((time||"").trim()?" @ "+time.trim():"")); saveDB(DB); render(); }
function seatReservation(id, tableId){ DB=loadDB(); const r=(DB.reservations||[]).find(x=>x.id===id); if(!r) return; r.status="seated"; if(tableId) r.tableId=tableId; logActivity("access","seated reservation · "+r.name); saveDB(DB);
  if(tableId) setTableState(tableId, (floorStates()[1]||floorStates()[0]).id); else render(); }   // save the seated status BEFORE setTableState (it reloads DB)
function cancelReservation(id){ DB=loadDB(); const r=(DB.reservations||[]).find(x=>x.id===id); if(!r) return; r.status="cancelled"; logActivity("access","cancelled reservation · "+r.name); saveDB(DB); render(); }
function activeWaitlist(){ return (DB.waitlist||[]).filter(w=>w.status==="waiting").sort((a,b)=>(a.addedTs||0)-(b.addedTs||0)); }
function waitlistWait(w){ return Math.round((Date.now()-(w.addedTs||Date.now()))/60000); }
function addWaitlist(name, party, quote, phone){ name=(name||"").trim(); if(!name){ flash("Name for the waitlist?"); return; }
  DB=loadDB(); DB.waitlist=DB.waitlist||[]; DB.waitlist.push({ id:"WL"+Date.now(), name, phone:(phone||"").trim(), party:Math.max(1,+party||1), quote:Math.max(0,+quote||0), addedTs:Date.now(), status:"waiting" });
  logActivity("access","waitlist + "+name+" ×"+(Math.max(1,+party||1))+((+quote||0)?" ~"+(+quote)+"m":"")); saveDB(DB); render(); }
function seatWaitlist(id, tableId){ DB=loadDB(); const w=(DB.waitlist||[]).find(x=>x.id===id); if(!w) return; w.status="seated"; if(tableId) w.tableId=tableId; logActivity("access","seated waitlist · "+w.name); saveDB(DB);
  if(tableId) setTableState(tableId, (floorStates()[1]||floorStates()[0]).id); else render(); }   // save before setTableState (it reloads DB)
function leaveWaitlist(id){ DB=loadDB(); const w=(DB.waitlist||[]).find(x=>x.id===id); if(!w) return; w.status="left"; logActivity("access","waitlist left · "+w.name); saveDB(DB); render(); }
// the host stand UI — a Reservations card and a Waitlist card, each with a quick add row + "Seat"/"clear".
// "Seat" uses the currently-selected table when one is picked, so the host taps a table then seats the party.
function renderHostStand(app){
  const seatTarget = selTable ? (" → "+tableLabel(selTable)) : "";
  const mkAdd=(fields, onAdd)=>{ const row=document.createElement("div"); row.className="opts"; row.style.cssText="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px";
    const els={}; fields.forEach(f=>{ const i=document.createElement("input"); i.placeholder=f.ph; i.id=f.id; if(f.w) i.style.width=f.w; if(f.type) i.type=f.type; row.appendChild(i); els[f.id]=i; });
    const add=document.createElement("button"); add.className="primary"; add.textContent="Add"; add.onclick=()=>{ onAdd(els); }; row.appendChild(add); return row; };
  // Reservations
  const rc=document.createElement("div"); rc.className="card"; rc.style.marginBottom="10px";
  rc.innerHTML="<div class='row'><b>🕐 Reservations</b> <span class='pill'>"+todayReservations().filter(r=>r.status==="booked").length+" booked</span></div>";
  todayReservations().forEach(r=>{ const row=document.createElement("div"); row.className="line";
    row.innerHTML="<span>"+(r.status==="seated"?"✓ ":"")+"<b>"+(r.time||"—")+"</b> · "+r.name+" ×"+r.party+(r.phone?" <span class='muted'>"+r.phone+"</span>":"")+(r.status==="seated"?" <span class='pill clock good'>seated</span>":"")+"</span><span class='spacer'></span>";
    if(r.status!=="seated"){ const s=document.createElement("button"); s.className="good"; s.textContent="Seat"+seatTarget; s.onclick=()=>seatReservation(r.id, selTable||null); row.appendChild(s);
      const x=document.createElement("button"); x.textContent="✕"; x.title="Cancel"; x.style.marginLeft="4px"; x.onclick=()=>cancelReservation(r.id); row.appendChild(x); }
    rc.appendChild(row); });
  rc.appendChild(mkAdd([{id:"rsvName",ph:"name"},{id:"rsvParty",ph:"party",w:"64px",type:"number"},{id:"rsvTime",ph:"time e.g. 7:00",w:"110px"},{id:"rsvPhone",ph:"phone (optional)"}],
    els=>{ addReservation(els.rsvName.value, els.rsvParty.value, els.rsvTime.value, els.rsvPhone.value); }));
  app.appendChild(rc);
  // Waitlist
  const wc=document.createElement("div"); wc.className="card"; wc.style.marginBottom="10px";
  wc.innerHTML="<div class='row'><b>📝 Waitlist</b> <span class='pill'>"+activeWaitlist().length+" waiting</span></div>";
  activeWaitlist().forEach(w=>{ const row=document.createElement("div"); row.className="line"; const waited=waitlistWait(w);
    row.innerHTML="<span><b>"+w.name+"</b> ×"+w.party+(w.quote?" · quoted "+w.quote+"m":"")+" <span class='muted'>· waiting "+waited+"m</span></span><span class='spacer'></span>";
    const s=document.createElement("button"); s.className="good"; s.textContent="Seat"+seatTarget; s.onclick=()=>seatWaitlist(w.id, selTable||null); row.appendChild(s);
    const x=document.createElement("button"); x.textContent="✕"; x.title="Left"; x.style.marginLeft="4px"; x.onclick=()=>leaveWaitlist(w.id); row.appendChild(x);
    wc.appendChild(row); });
  wc.appendChild(mkAdd([{id:"wlName",ph:"name"},{id:"wlParty",ph:"party",w:"64px",type:"number"},{id:"wlQuote",ph:"quote min",w:"90px",type:"number"},{id:"wlPhone",ph:"phone (optional)"}],
    els=>{ addWaitlist(els.wlName.value, els.wlParty.value, els.wlQuote.value, els.wlPhone.value); }));
  app.appendChild(wc);
}
function renderFloor(app, station){
  const cfg=FLOW.floor||{ tables:[] };
  app.innerHTML="<h2>"+station.label+"</h2>";
  renderHostStand(app);   // 🕐 reservations + waitlist at the top of the host's floor screen
  const tables=(cfg.tables||[]).filter(t=> (!floorSection || (t.section||"")===floorSection) && (!floorServer || tableServer(t.id)===floorServer));
  const sections=cfg.sections || [...new Set((cfg.tables||[]).map(t=>t.section).filter(Boolean))];
  // section filter (server sees a section; manager sees all)
  if(sections.length){ const bar=document.createElement("div"); bar.className="opts"; bar.style.marginBottom="10px";
    const mk=(lab,val)=>{ const b=document.createElement("button"); if(floorSection===val) b.className="sel"; b.textContent=lab; b.onclick=()=>{ floorSection=val; selTable=null; render(); }; bar.appendChild(b); };
    mk("All", null); sections.forEach(s=>mk(s, s)); app.appendChild(bar); }
  // 🧑‍🍳 "my tables" — filter the floor to one server's tables
  if(serverStaff().length){ const sbar=document.createElement("div"); sbar.className="opts"; sbar.style.marginBottom="10px";
    const lbl=document.createElement("span"); lbl.className="muted"; lbl.style.marginRight="6px"; lbl.textContent="Tables:"; sbar.appendChild(lbl);
    const mk=(lab,val)=>{ const b=document.createElement("button"); if(floorServer===val) b.className="sel"; b.textContent=lab; b.onclick=()=>{ floorServer=val; selTable=null; render(); }; sbar.appendChild(b); };
    mk("All", null); serverStaff().forEach(s=>mk(s.name, s.name)); app.appendChild(sbar); }
  // at-a-glance: how many tables are occupied (not empty)
  const occupied=tables.filter(t=>tableRec(t).state!=="empty").length;
  const meta=document.createElement("p"); meta.className="muted"; meta.style.margin="0 0 10px"; meta.textContent=occupied+" of "+tables.length+" tables occupied · tap a table to advance it"; app.appendChild(meta);
  // turn-time analytics — today's completed turns, average turn, covers served (seats × turns)
  const ts=turnStats();
  const an=document.createElement("div"); an.className="card"; an.style.cssText="display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px";
  const stat=(lab,val)=>"<div><div style='font-size:20px;font-weight:700'>"+val+"</div><div class='muted' style='font-size:12px'>"+lab+"</div></div>";
  an.innerHTML=stat("turns today", ts.n)+stat("avg turn", ts.n?fmtDur(ts.avgMs/1000):"—")+stat("covers", ts.covers)+stat("open", occupied+"/"+tables.length);
  app.appendChild(an);
  // the grid — each table colored by state, minutes-in-state, pulsing if it's been sitting too long.
  // If tables carry x,y (from the floor designer) lay them out spatially; otherwise auto-flow.
  const positioned = tables.some(t=>t.x!=null);
  const grid=document.createElement("div");
  if(positioned){ const h=Math.max(140, ...tables.map(t=>(t.y||0)+92)); grid.style.cssText="position:relative;min-height:"+h+"px"; }
  else grid.className="floorgrid";
  const warn=cfg.warnSec||600;
  tables.forEach(t=>{ const tr=tableRec(t); const st=floorStateById(tr.state); const el=tr.since?(Date.now()-tr.since)/1000:0;
    const b=document.createElement("button"); b.className="tabletile"+(tr.since&&el>=warn&&st.id!=="empty"?" warn":""); b.style.background=st.color; b.dataset.table=t.id;
    if(positioned){ b.style.position="absolute"; b.style.left=(t.x||0)+"px"; b.style.top=(t.y||0)+"px"; b.style.width="88px"; }
    const chk=tableOpenTotal(t.id);
    b.innerHTML="<b>"+ (t.label||t.id) +"</b> <span style='float:right;font-size:12px'>"+st.label+"</span>"
      +"<small>"+(t.seats?t.seats+" seats":"")+(t.section?" · "+t.section:"")+"</small>"
      +"<small>"+(tableServer(t.id)?"🧑‍🍳 "+tableServer(t.id):"")+"</small>"
      +"<small>"+(chk>0.0001?"🧾 "+money(chk)+" open":(tr.since?fmtDur(el)+" in state":"—"))+"</small>";
    b.onclick=()=>{ selTable=(selTable===t.id?null:t.id); render(); };
    grid.appendChild(b); });
  app.appendChild(grid);
  // selected table: advance to the next state, or jump to any state
  if(selTable){ const t=(cfg.tables||[]).find(x=>x.id===selTable);
    if(t){ const tr=tableRec(t); const st=floorStateById(tr.state); const nx=st.next?floorStateById(st.next):null;
      const c=document.createElement("div"); c.className="card"; c.style.marginTop="12px";
      c.innerHTML="<div class='row'><b>"+(t.label||t.id)+"</b> <span class='pill'>"+st.label+"</span><span class='spacer'></span><span class='muted'>"+(t.seats?t.seats+" seats":"")+"</span></div>";
      // open check(s) rung to this table
      const chks=tableOpenOrders(t.id);
      if(chks.length){ const ck=document.createElement("div"); ck.style.cssText="margin:6px 0"; ck.innerHTML="<div class='muted'>Open check"+(chks.length>1?"s":"")+"</div>";
        chks.forEach(r=>{ const row=document.createElement("div"); row.className="line"; row.innerHTML="<span>#"+r.number+" · "+r.lines.length+" item(s)</span><span class='spacer'></span><span>"+money(recordBalance(r))+" due</span>"; ck.appendChild(row); });
        c.appendChild(ck);
      } else { const e=document.createElement("div"); e.className="muted"; e.style.margin="4px 0"; e.textContent="No open check — ring one at the register and tag this table."; c.appendChild(e); }
      if(nx){ const adv=document.createElement("button"); adv.className="primary"; adv.textContent="→ "+nx.label; adv.style.margin="4px 8px 8px 0"; adv.onclick=()=>{ setTableState(t.id, nx.id); }; c.appendChild(adv); }
      const jump=document.createElement("div"); jump.className="opts";
      floorStates().forEach(s=>{ const b=document.createElement("button"); if(s.id===st.id) b.className="sel"; b.textContent=s.label; b.onclick=()=>setTableState(t.id, s.id); jump.appendChild(b); });
      c.appendChild(jump);
      // 🧑‍🍳 assign a server to this table (or clear)
      if(serverStaff().length){ const sv=document.createElement("div"); sv.className="opts"; sv.style.marginTop="8px";
        const lbl=document.createElement("span"); lbl.className="muted"; lbl.style.marginRight="6px"; lbl.textContent="Server:"; sv.appendChild(lbl);
        serverStaff().forEach(s=>{ const b=document.createElement("button"); if(tableServer(t.id)===s.name) b.className="sel"; b.textContent=s.name; b.onclick=()=>assignServer(t.id, tableServer(t.id)===s.name?null:s.name); sv.appendChild(b); });
        c.appendChild(sv); }
      // 🔀 transfer / merge this table's open check to another table
      if(tableOpenOrders(t.id).length){ const mv=document.createElement("div"); mv.className="opts"; mv.style.marginTop="8px";
        const lbl=document.createElement("span"); lbl.className="muted"; lbl.style.marginRight="6px"; lbl.textContent="Move check to:"; mv.appendChild(lbl);
        (cfg.tables||[]).filter(x=>x.id!==t.id).forEach(x=>{ const occ=tableOpenOrders(x.id).length; const b=document.createElement("button");
          b.textContent=(x.label||x.id)+(occ?" (merge)":""); b.title=occ?("Merge onto "+(x.label||x.id)):("Move to "+(x.label||x.id)); b.onclick=()=>moveTable(t.id, x.id); mv.appendChild(b); });
        c.appendChild(mv); }
      app.appendChild(c);
    }
  }
}

/* ===================================== STAFF SCHEDULING =====================================
   Worker-rights foundation (see docs/WORKER-RIGHTS.md, Phase 1): a weekly grid of staff × days.
   Set a shift per cell, see weekly hours with an overtime warning, publish → notify each worker.
   Shifts live in DB.shifts; DB.schedule holds the published stamp. Defaults tilt toward the worker. */
const SCHED_DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const OT_THRESHOLD = 40;   // weekly hours over this flag as overtime (US federal default)
function parseHM(s){ if(!s) return null; const [h,m]=String(s).split(":").map(Number); return h*60+(m||0); }
function shiftHrs(s){ const a=parseHM(s.start), b=parseHM(s.end); if(a==null||b==null||b<=a) return 0; return (b-a)/60; }
function staffShifts(id){ return (DB.shifts||[]).filter(s=>s.staffId===id); }
function cellShift(id, day){ return (DB.shifts||[]).find(s=>s.staffId===id && s.day===day); }
function weeklyHours(id){ return staffShifts(id).reduce((h,s)=>h+shiftHrs(s),0); }
// --- time off: a worker requests a day, a manager approves; approved days block scheduling (worker-protective) ---
function timeoffReq(id, day){ return (DB.timeoff||[]).find(t=>t.staffId===id && t.day===day && t.status!=="denied"); }
function pendingTimeoff(){ return (DB.timeoff||[]).filter(t=>t.status==="pending"); }
function requestTimeoff(id, name, day, reason){ DB=loadDB(); DB.timeoff=DB.timeoff||[];
  if(DB.timeoff.some(t=>t.staffId===id && t.day===day && t.status!=="denied")){ render(); return; }   // one open request per day
  DB.timeoff.push({ id:"T"+Date.now()+day, staffId:id, name, day, reason:reason||"", status:"pending", ts:Date.now() }); saveDB(DB); render();
}
function setTimeoff(reqId, status){ DB=loadDB(); const t=(DB.timeoff||[]).find(x=>x.id===reqId); if(!t) return;
  t.status=status;
  if(status==="approved"){ DB.shifts=(DB.shifts||[]).filter(s=>!(s.staffId===t.staffId && s.day===t.day));   // can't be both off and scheduled
    DB.schedule=DB.schedule||{}; delete DB.schedule.published; delete DB.schedule.notified; }
  saveDB(DB); render();
}
// --- shift coverage: a worker offers a shift, the manager reassigns it to an eligible co-worker ---
function offeredShifts(){ return (DB.shifts||[]).filter(s=>s.offered); }
function offerShift(shiftId){ DB=loadDB(); const s=(DB.shifts||[]).find(x=>x.id===shiftId); if(s) s.offered=true; saveDB(DB); render(); }
function cancelOffer(shiftId){ DB=loadDB(); const s=(DB.shifts||[]).find(x=>x.id===shiftId); if(s) delete s.offered; saveDB(DB); render(); }
function coverShift(shiftId, toId){ DB=loadDB(); const s=(DB.shifts||[]).find(x=>x.id===shiftId); if(!s) return;
  if((DB.timeoff||[]).some(t=>t.staffId===toId && t.day===s.day && t.status==="approved")){ flash("They're approved off that day"); render(); return; }
  if((DB.shifts||[]).some(x=>x.staffId===toId && x.day===s.day)){ flash("They're already scheduled that day"); render(); return; }
  s.staffId=toId; delete s.offered;
  DB.schedule=DB.schedule||{}; delete DB.schedule.published; delete DB.schedule.notified;   // reassignment un-publishes
  saveDB(DB); render();
}
function setShift(id, day, start, end){
  DB=loadDB();
  if(start && end && (DB.timeoff||[]).some(t=>t.staffId===id && t.day===day && t.status==="approved")){
    flash(((FLOW.staff||[]).find(s=>s.id===id)||{}).name+" is approved off "+SCHED_DAYS[day]+" — clear the day off first"); render(); return; }
  DB.shifts=(DB.shifts||[]).filter(s=>!(s.staffId===id && s.day===day));
  if(start && end) DB.shifts.push({ id:"S"+Date.now()+day, staffId:id, day, start, end });
  DB.schedule=DB.schedule||{}; delete DB.schedule.published; delete DB.schedule.notified;   // any edit un-publishes (change requires re-publish)
  saveDB(DB); render();
}
function publishSchedule(){
  DB=loadDB(); DB.schedule=DB.schedule||{}; DB.schedule.published=Date.now(); DB.schedule.notified=[];
  if(FLOW.endpoints && FLOW.endpoints.notify){ (FLOW.staff||[]).forEach(w=>{ const sh=staffShifts(w.id); if(sh.length){
    const body="Hi "+w.name+", your shifts are posted — "+sh.sort((a,b)=>a.day-b.day).map(s=>SCHED_DAYS[s.day]+" "+s.start+"–"+s.end).join(", ")+".";
    notifyAdapter().send(w.phone||"", body); DB.schedule.notified.push(w.name); } }); }
  saveDB(DB); render();
}
function renderSchedule(app, station){
  app.innerHTML="<h2>"+station.label+"</h2><p class='muted'>Set each shift, then publish. Editing a published week un-publishes it until you re-post — staff never get a silent change.</p>";
  const staff=FLOW.staff||[];
  if(!staff.length){ const e=document.createElement("div"); e.className="empty card"; e.textContent="No staff configured. Add staff (name + PIN) in the builder."; app.appendChild(e); return; }
  // the week grid
  const wrap=document.createElement("div"); wrap.className="card"; wrap.style.overflowX="auto";
  const tbl=document.createElement("table"); tbl.style.cssText="border-collapse:collapse;width:100%;min-width:560px;font-size:13px";
  tbl.innerHTML="<tr><th style='text-align:left;padding:6px'>Staff</th>"+SCHED_DAYS.map(d=>"<th style='padding:6px'>"+d+"</th>").join("")+"<th style='padding:6px'>Hrs</th></tr>";
  staff.forEach(w=>{ const tr=document.createElement("tr"); const hrs=weeklyHours(w.id); const ot=hrs>OT_THRESHOLD;
    const name=document.createElement("td"); name.style.cssText="padding:6px;font-weight:600"; name.textContent=w.name; tr.appendChild(name);
    SCHED_DAYS.forEach((d,di)=>{ const td=document.createElement("td"); td.style.cssText="padding:3px;text-align:center";
      const sh=cellShift(w.id, di); const to=timeoffReq(w.id, di);
      const b=document.createElement("button"); b.style.cssText="width:100%;padding:5px 4px;font-size:12px"; if(selCell&&selCell.id===w.id&&selCell.day===di) b.className="sel";
      if(to && to.status==="approved"){ b.textContent="OFF"; b.style.opacity=".65"; b.title="Approved time off"; }
      else if(to){ b.textContent="off?"; b.title="Time-off requested — pending"; }
      else if(sh && sh.offered){ b.textContent=sh.start+"–"+sh.end+" ↔"; b.title="Offered for coverage"; }
      else b.textContent= sh ? (sh.start+"–"+sh.end) : "+";
      b.onclick=()=>{ selCell={ id:w.id, day:di }; render(); };
      td.appendChild(b); tr.appendChild(td); });
    const tot=document.createElement("td"); tot.style.cssText="padding:6px;text-align:center;font-weight:600"; tot.innerHTML=hrs.toFixed(1)+(ot?" <span class='pill flag'>OT</span>":""); tr.appendChild(tot);
    tbl.appendChild(tr); });
  wrap.appendChild(tbl); app.appendChild(wrap);
  // cell editor
  if(selCell){ const w=staff.find(x=>x.id===selCell.id); const sh=cellShift(selCell.id, selCell.day)||{}; const to=timeoffReq(selCell.id, selCell.day);
    const c=document.createElement("div"); c.className="card";
    c.innerHTML="<div class='row'><b>"+w.name+" · "+SCHED_DAYS[selCell.day]+"</b></div>";
    if(to && to.status==="approved"){
      const note=document.createElement("div"); note.className="muted"; note.textContent="✓ Approved day off"+(to.reason?" — "+to.reason:"")+". Clear the day off to schedule a shift."; c.appendChild(note);
    } else {
      const start=document.createElement("input"); start.type="time"; start.id="shiftStart"; start.value=sh.start||"09:00"; start.style.margin="0 8px 0 0";
      const end=document.createElement("input"); end.type="time"; end.id="shiftEnd"; end.value=sh.end||"17:00";
      const fld=document.createElement("div"); fld.className="fld"; fld.innerHTML="<span class='flab'>Shift</span>"; fld.appendChild(start); fld.appendChild(document.createTextNode(" to ")); fld.appendChild(end); c.appendChild(fld);
      const save=document.createElement("button"); save.className="primary"; save.textContent="Save shift"; save.style.margin="8px 8px 0 0"; save.onclick=()=>{ setShift(selCell.id, selCell.day, start.value, end.value); selCell=null; }; c.appendChild(save);
      if(sh.start){ const clr=document.createElement("button"); clr.textContent="Clear"; clr.style.marginTop="8px"; clr.onclick=()=>{ setShift(selCell.id, selCell.day, null, null); selCell=null; }; c.appendChild(clr); }
      // shift coverage — offer this shift, then reassign it to an eligible co-worker
      if(sh.id){ const cv=document.createElement("div"); cv.style.cssText="margin-top:10px;border-top:1px solid var(--line);padding-top:8px";
        if(!sh.offered){ const off=document.createElement("button"); off.textContent="Offer for coverage"; off.onclick=()=>{ offerShift(sh.id); selCell=null; }; cv.appendChild(off); }
        else { const m=document.createElement("div"); m.className="muted"; m.textContent="↔ Needs coverage — reassign to:"; cv.appendChild(m);
          const opts=document.createElement("div"); opts.className="opts";
          staff.filter(o=>o.id!==selCell.id).forEach(o=>{ const offday=timeoffReq(o.id, selCell.day); const busy=cellShift(o.id, selCell.day);
            const blocked=(offday&&offday.status==="approved")||busy; const ot=(weeklyHours(o.id)+shiftHrs(sh))>OT_THRESHOLD;
            const bt=document.createElement("button"); bt.textContent=o.name+(ot?" (OT)":""); if(blocked){ bt.disabled=true; bt.title=busy?"already scheduled that day":"approved off that day"; }
            bt.onclick=()=>{ coverShift(sh.id, o.id); selCell=null; }; opts.appendChild(bt); });
          cv.appendChild(opts);
          const cancel=document.createElement("button"); cancel.textContent="Cancel offer"; cancel.style.marginTop="8px"; cancel.onclick=()=>{ cancelOffer(sh.id); selCell=null; }; cv.appendChild(cancel);
        }
        c.appendChild(cv);
      }
    }
    // time-off controls — request (worker), approve/deny (manager), cancel an approved day off
    const tw=document.createElement("div"); tw.style.cssText="margin-top:10px;border-top:1px solid var(--line);padding-top:8px";
    if(!to){ const ri=document.createElement("input"); ri.id="offReason"; ri.placeholder="reason (optional)"; ri.style.cssText="margin-right:8px;max-width:180px";
      const rb=document.createElement("button"); rb.textContent="Request day off"; rb.onclick=()=>{ requestTimeoff(selCell.id, w.name, selCell.day, ri.value); selCell=null; }; tw.appendChild(ri); tw.appendChild(rb);
    } else if(to.status==="pending"){ const m=document.createElement("div"); m.className="muted"; m.textContent="Time-off requested"+(to.reason?": "+to.reason:""); tw.appendChild(m);
      const ap=document.createElement("button"); ap.className="primary"; ap.textContent="Approve day off"; ap.style.margin="6px 8px 0 0"; ap.onclick=()=>{ setTimeoff(to.id,"approved"); selCell=null; }; tw.appendChild(ap);
      const dn=document.createElement("button"); dn.textContent="Deny"; dn.style.marginTop="6px"; dn.onclick=()=>{ setTimeoff(to.id,"denied"); selCell=null; }; tw.appendChild(dn);
    } else { const cancel=document.createElement("button"); cancel.textContent="Cancel day off"; cancel.onclick=()=>{ setTimeoff(to.id,"denied"); selCell=null; }; tw.appendChild(cancel); }
    c.appendChild(tw); app.appendChild(c);
  }
  // manager queue — pending time-off requests at a glance
  const pend=pendingTimeoff();
  if(pend.length){ const q=document.createElement("div"); q.className="card"; q.innerHTML="<div class='row'><b>Time-off requests</b> <span class='pill'>"+pend.length+"</span></div>";
    pend.forEach(t=>{ const row=document.createElement("div"); row.className="line";
      row.innerHTML="<span>"+t.name+" · "+SCHED_DAYS[t.day]+(t.reason?" — "+t.reason:"")+"</span>";
      const sp=document.createElement("span"); sp.className="spacer"; row.appendChild(sp);
      const ap=document.createElement("button"); ap.className="primary"; ap.textContent="Approve"; ap.style.marginRight="6px"; ap.onclick=()=>setTimeoff(t.id,"approved"); row.appendChild(ap);
      const dn=document.createElement("button"); dn.textContent="Deny"; dn.onclick=()=>setTimeoff(t.id,"denied"); row.appendChild(dn);
      q.appendChild(row); });
    app.appendChild(q);
  }
  // publish + notify
  const pub=document.createElement("div"); pub.className="card";
  const total=staff.reduce((h,w)=>h+weeklyHours(w.id),0);
  pub.innerHTML="<div class='line'><span>Scheduled this week</span><span class='spacer'></span><b>"+total.toFixed(1)+" h</b></div>";
  if(DB.schedule && DB.schedule.published){ const pl=document.createElement("div"); pl.className="muted"; pl.style.margin="6px 0"; pl.textContent="✓ Published"+((DB.schedule.notified&&DB.schedule.notified.length)?" · texted "+DB.schedule.notified.join(", "):""); pub.appendChild(pl); }
  const pb=document.createElement("button"); pb.className="primary"; pb.textContent=(DB.schedule&&DB.schedule.published)?"Re-publish":"📣 Publish schedule"; pb.style.marginTop="6px"; pb.onclick=()=>{ publishSchedule(); }; pub.appendChild(pb);
  app.appendChild(pub);
}

/* SHOUT-OUTS (kudos) — recognition is free and it matters most when money's tight. Anyone can hand a teammate a
   kudos; it shows on their portal and greets them at clock-in. Lives in DB.kudos. */
function kudosFor(id){ return (DB.kudos||[]).filter(k=>k.to===id).sort((a,b)=>(b.ts||0)-(a.ts||0)); }
function giveKudos(fromName, toId, toName, note){ if(!toId||!note) return; DB=loadDB(); DB.kudos=DB.kudos||[];
  DB.kudos.push({ id:"K"+Date.now(), from:fromName||"A teammate", to:toId, toName, note, ts:Date.now(), day:todayStr() }); saveDB(DB); render(); }

/* WORKER PORTAL — the worker's own view: log in by PIN, see your week, hours, and pay, claim open shifts
   yourself (self-serve coverage), and request time off. Everything rides the same synced DB the manager uses. */
function renderWorker(app, station){
  const staff=FLOW.staff||[];
  app.innerHTML="<h2>"+station.label+"</h2>";
  if(!staff.length){ const e=document.createElement("div"); e.className="empty card"; e.textContent="No staff configured. Add staff (name + PIN) in the builder."; app.appendChild(e); return; }
  // stay signed in on a personal device: restore a remembered worker (per device)
  if(!workerId){ try{ const saved=localStorage.getItem(wkey()); if(saved && staff.some(s=>s.id===saved)) workerId=saved; }catch(e){} }
  const me = workerId && staff.find(s=>s.id===workerId);
  // --- PIN gate: identify the worker on this device ---
  if(!me){ const sub=document.createElement("p"); sub.className="muted"; sub.textContent="Enter your PIN to see your schedule, hours, and pay."; app.appendChild(sub);
    const pad=document.createElement("div"); pad.className="card"; pad.style.maxWidth="260px";
    const disp=document.createElement("div"); disp.style.cssText="font-size:28px;letter-spacing:8px;text-align:center;min-height:36px;margin-bottom:8px"; disp.textContent=pinBuf.replace(/./g,"•")||"—"; pad.appendChild(disp);
    const grid=document.createElement("div"); grid.style.cssText="display:grid;grid-template-columns:repeat(3,1fr);gap:6px";
    const press=d=>{ pinBuf=(pinBuf+d).slice(0,8); render(); };
    ["1","2","3","4","5","6","7","8","9"].forEach(d=>{ const b=document.createElement("button"); b.textContent=d; b.onclick=()=>press(d); grid.appendChild(b); });
    const clr=document.createElement("button"); clr.textContent="⌫"; clr.onclick=()=>{ pinBuf=pinBuf.slice(0,-1); render(); }; grid.appendChild(clr);
    const zero=document.createElement("button"); zero.textContent="0"; zero.onclick=()=>press("0"); grid.appendChild(zero);
    const ent=document.createElement("button"); ent.className="primary"; ent.textContent="✓"; ent.onclick=()=>{ const who=staff.find(s=>String(s.pin)===pinBuf); if(who){ workerId=who.id; const rm=document.getElementById("wkRemember"); if(!rm||rm.checked){ try{ localStorage.setItem(wkey(), who.id); }catch(e){} } pinBuf=""; render(); } else { pinBuf=""; flash("PIN not recognized"); render(); } }; grid.appendChild(ent);
    pad.appendChild(grid); app.appendChild(pad);
    // stay-signed-in choice (on by default — the portal is meant for a worker's own phone; uncheck on a shared device)
    const rmw=document.createElement("label"); rmw.className="muted"; rmw.style.cssText="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px";
    const cb=document.createElement("input"); cb.type="checkbox"; cb.id="wkRemember"; cb.checked=true; rmw.appendChild(cb); rmw.appendChild(document.createTextNode("Keep me signed in on this device"));
    app.appendChild(rmw); return;
  }
  // --- my dashboard ---
  const head=document.createElement("div"); head.className="row"; head.innerHTML="<h3 style='margin:0'>Hi "+me.name+"</h3>"; const sp=document.createElement("span"); sp.className="spacer"; head.appendChild(sp);
  const out=document.createElement("button"); out.textContent="Log out"; out.onclick=()=>{ workerId=null; try{ localStorage.removeItem(wkey()); }catch(e){} render(); }; head.appendChild(out); app.appendChild(head);
  // today: hours + earnings
  const open=openPunch(me.id); const stat=document.createElement("div"); stat.className="card"; stat.style.cssText="display:flex;gap:20px;flex-wrap:wrap";
  const cell=(lab,val)=>"<div><div style='font-size:20px;font-weight:700'>"+val+"</div><div class='muted' style='font-size:12px'>"+lab+"</div></div>";
  stat.innerHTML=cell("today", hoursToday(me.id).toFixed(2)+" h")+(staffWage(me.id)?cell("earned today","$"+earnedToday(me.id).toFixed(2)):"")+(tipPoolOn()?cell("tip share today","$"+tipShareFor(me.name, todayStr()).toFixed(2)):"")+cell("this week", weeklyHours(me.id).toFixed(1)+" h"+(weeklyHours(me.id)>OT_THRESHOLD?" · OT":""))+cell("status", open?(onBreak(open)?"on break":"on the clock"):"off");
  app.appendChild(stat);
  // my pay estimate — makes the overtime premium visible so it can't quietly be skipped
  if(staffWage(me.id)>0){ const worked=hoursToday(me.id), wage=staffWage(me.id);
    const reg=Math.min(OT_THRESHOLD, worked), ot=Math.max(0, worked-OT_THRESHOLD);
    const regPay=reg*wage, otPay=ot*wage*1.5; const tipShare=tipPoolOn()?tipShareFor(me.name, todayStr()):0;
    const pay=document.createElement("div"); pay.className="card"; pay.innerHTML="<div class='row'><b>My pay — estimate</b></div>";
    const line=(l,v)=>"<div class='line'><span>"+l+"</span><span class='spacer'></span><span>"+v+"</span></div>";
    pay.innerHTML+=line("Regular · "+reg.toFixed(2)+" h × $"+wage.toFixed(2), "$"+regPay.toFixed(2));
    if(ot>0) pay.innerHTML+=line("Overtime · "+ot.toFixed(2)+" h × $"+(wage*1.5).toFixed(2)+" <span class='pill flag'>1.5×</span>", "$"+otPay.toFixed(2));
    if(tipShare>0) pay.innerHTML+=line("Tips (today's pool)", "$"+tipShare.toFixed(2));
    pay.innerHTML+="<div class='line'><b>Estimated gross</b><span class='spacer'></span><b>$"+(regPay+otPay+tipShare).toFixed(2)+"</b></div>";
    pay.innerHTML+="<div class='muted' style='margin-top:2px'>An estimate from your clocked hours — your official paystub is the final word.</div>";
    app.appendChild(pay);
  }
  // my week
  const wk=document.createElement("div"); wk.className="card"; wk.innerHTML="<div class='row'><b>My week</b>"+((DB.schedule&&DB.schedule.published)?" <span class='pill'>posted</span>":" <span class='muted'>draft — not final</span>")+"</div>";
  SCHED_DAYS.forEach((d,di)=>{ const sh=cellShift(me.id,di); const to=timeoffReq(me.id,di); const row=document.createElement("div"); row.className="line";
    const val = (to&&to.status==="approved") ? "OFF" : (to?"off requested":(sh? sh.start+"–"+sh.end+(sh.offered?" ↔ offered":"") : "—"));
    row.innerHTML="<span>"+d+"</span><span class='spacer'></span><span class='muted'>"+val+"</span>"; wk.appendChild(row); });
  app.appendChild(wk);
  // open shifts I can pick up (self-serve coverage) — the marketplace half, worker-initiated
  const open4me = offeredShifts().filter(s=>s.staffId!==me.id);
  const oc=document.createElement("div"); oc.className="card"; oc.innerHTML="<div class='row'><b>Open shifts</b>"+(open4me.length?" <span class='pill'>"+open4me.length+"</span>":"")+"</div>";
  if(!open4me.length){ const e=document.createElement("div"); e.className="muted"; e.textContent="No shifts are up for coverage right now."; oc.appendChild(e); }
  open4me.forEach(s=>{ const poster=(staff.find(x=>x.id===s.staffId)||{}).name||"?"; const offday=timeoffReq(me.id,s.day); const busy=cellShift(me.id,s.day);
    const blocked=(offday&&offday.status==="approved")||busy; const ot=(weeklyHours(me.id)+shiftHrs(s))>OT_THRESHOLD;
    const row=document.createElement("div"); row.className="line"; row.innerHTML="<span>"+SCHED_DAYS[s.day]+" "+s.start+"–"+s.end+" <span class='muted'>· "+poster+"'s shift</span>"+(ot?" <span class='pill flag'>OT</span>":"")+"</span>";
    const spc=document.createElement("span"); spc.className="spacer"; row.appendChild(spc);
    const cl=document.createElement("button"); cl.className="primary"; cl.textContent="Claim"; if(blocked){ cl.disabled=true; cl.title=busy?"you're already scheduled that day":"you're off that day"; } cl.onclick=()=>coverShift(s.id, me.id); row.appendChild(cl); oc.appendChild(row); });
  app.appendChild(oc);
  // request time off
  const rt=document.createElement("div"); rt.className="card"; rt.innerHTML="<div class='row'><b>Request a day off</b></div>";
  const drow=document.createElement("div"); drow.className="opts";
  SCHED_DAYS.forEach((d,di)=>{ const to=timeoffReq(me.id,di); const b=document.createElement("button"); b.textContent=d+(to?(to.status==="approved"?" ✓":" …"):""); if(to){ b.disabled=true; b.title=to.status==="approved"?"approved off":"requested"; } b.onclick=()=>{ requestTimeoff(me.id, me.name, di, ""); }; drow.appendChild(b); });
  rt.appendChild(drow); const hint=document.createElement("div"); hint.className="muted"; hint.style.marginTop="6px"; hint.textContent="Tap a day to request it off — your manager approves."; rt.appendChild(hint);
  app.appendChild(rt);
  // shout-outs: kudos you've received, and a way to hand one to a teammate
  const mine=kudosFor(me.id).slice(0,5);
  const ko=document.createElement("div"); ko.className="card"; ko.innerHTML="<div class='row'><b>Shout-outs</b>"+(mine.length?" <span class='pill'>"+kudosFor(me.id).length+"</span>":"")+"</div>";
  if(!mine.length){ const e=document.createElement("div"); e.className="muted"; e.textContent="No shout-outs yet — be the first to give one below."; ko.appendChild(e); }
  mine.forEach(k=>{ const row=document.createElement("div"); row.className="line"; row.innerHTML="<span>⭐ <b>"+k.from+"</b>: "+k.note+" <small class='muted'>· "+k.day+"</small></span>"; ko.appendChild(row); });
  // give a shout-out to a coworker
  const others=staff.filter(s=>s.id!==me.id);
  if(others.length){ const give=document.createElement("div"); give.style.cssText="margin-top:10px;border-top:1px solid var(--line);padding-top:8px";
    const sel=document.createElement("select"); sel.id="kudosTo"; others.forEach(o=>{ const op=document.createElement("option"); op.value=o.id; op.textContent=o.name; sel.appendChild(op); }); sel.style.marginRight="8px";
    const note=document.createElement("input"); note.id="kudosNote"; note.placeholder="say something kind…"; note.style.cssText="max-width:220px;margin-right:8px";
    const b=document.createElement("button"); b.className="primary"; b.textContent="Send ⭐"; b.onclick=()=>{ const o=others.find(x=>x.id===sel.value); if(note.value.trim()){ giveKudos(me.name, sel.value, o?o.name:"", note.value.trim()); } };
    give.appendChild(sel); give.appendChild(note); give.appendChild(b); ko.appendChild(give);
  }
  app.appendChild(ko);
}

/* STATUS BOARD — internal broadcast: every live record by status, read-only, with location + clock */
function renderBoard(app, station){
  app.innerHTML="<h2>"+station.label+"</h2>";
  ["In progress","Ready","Completed"].forEach(lbl=>{
    const sts = lbl==="In progress"?["INPROGRESS"]:lbl==="Ready"?["READY","PAID"]:["CLOSED"];
    const recs=DB.records.filter(r=>sts.includes(r.status));
    const h=document.createElement("h2"); h.textContent=lbl+" ("+recs.length+")"; h.style.fontSize="13px"; app.appendChild(h);
    if(!recs.length){ const e=document.createElement("div"); e.className="muted"; e.style.margin="0 0 8px"; e.textContent="—"; app.appendChild(e); }
    recs.forEach(r=>{ const c=document.createElement("div"); c.className="card";

function attachCustomer(phone, name){
  phone=(phone||"").trim(); if(!phone) return;
  DB=loadDB(); const found=(DB.customers||[]).find(c=>c.phone===phone);
  draft.customer = found ? {...found} : { phone, name:(name||"").trim()||phone, lastItems:[], points:0, gift:0 };
  render();
}
/* loyalty + gift card settlement, applied once when a record is paid */
function onPaid(r){
  if(!r.customer) return;
  const loy=FLOW.endpoints.loyalty;
  const c=(DB.customers||[]).find(x=>x.phone===r.customer.phone); if(!c) return;
  c.points=c.points||0; c.gift=c.gift||0;
  if(loy) c.points += Math.floor(recordTotal(r))*(loy.earnPerDollar||1);               // earn on the ticket
  const gc=r.lines.filter(l=>l.category==="giftcard").reduce((s,l)=>s+l.price*l.qty,0); // gift cards bought credit balance
  if(gc) c.gift += gc;
  if(r.redeemPts) c.points = Math.max(0, c.points - r.redeemPts);                       // spend redeemed points
  if(r.giftUsed)  c.gift   = Math.max(0, c.gift - r.giftUsed);                          // spend gift balance
}

    tb.appendChild(opts); app.appendChild(tb);

  // 👤 seat picker — dine-in seat-by-seat ordering. Pick a seat and the items you tap ring to that seat (so the

  // Seats shown = the table's capacity, or higher if the ticket already used more, or the server added seats.

    for(let n=1;n<=shown;n++){ const cnt=(draft.lines||[]).filter(l=>(+l.seat||0)===n).length; const b=document.createElement("button"); if(draft.seat===n) b.className="sel";
      b.textContent="Seat "+n+(cnt?" ("+cnt+")":""); b.onclick=()=>{ draft.seat=n; render(); }; sopts.appendChild(b); }
    const add=document.createElement("button"); add.textContent="+ seat"; add.title="Add another seat"; add.onclick=()=>{ draft.__seatMax=shown+1; draft.seat=shown+1; render(); }; sopts.appendChild(add);
    sc.appendChild(sopts); app.appendChild(sc);
  }

      const opts=document.createElement("div"); opts.className="opts"; opts.style.cssText="display:flex;flex-wrap:wrap;gap:6px";
      sugg.forEach(it=>{ const b=document.createElement("button"); b.textContent="+ "+it.name+" "+money(itemPriceNow(it)); b.onclick=()=>addItem(it); opts.appendChild(b); });
      sc.appendChild(opts); app.appendChild(sc); }
  }
  // deposit control (deposit-balance payment point)
  const dep = FLOW.endpoints.payment.deposit;
  if(dep && station.view.money && draft.lines.length){
    const amt=+(draft.lines.reduce((s,l)=>s+l.price*l.qty,0)*dep.pct/100).toFixed(2);
    const db=document.createElement("button"); if(draft.takeDeposit) db.className="sel"; db.style.marginRight="8px";
    db.textContent=(draft.takeDeposit?"✓ ":"")+"Take "+dep.pct+"% deposit "+money(amt);
    db.onclick=()=>{ draft.takeDeposit=!draft.takeDeposit; render(); }; app.appendChild(db);
  }
  // capacity & pacing: a live wait estimate, and a hard cap on orders in the queue
  let atCapacity=false;
  const cap=FLOW.capacity;
  if(cap){
    const active=DB.records.filter(r=>r.status==="INPROGRESS").length;
    atCapacity = active>=cap.max;
    const info=document.createElement("div"); info.className="muted"; info.style.margin="6px 0";
    info.textContent = atCapacity ? "⛔ At capacity ("+active+" in the queue) — hold new orders"
                                  : "~"+(active*cap.perOrderMins)+" min wait · "+active+" in the queue";
    app.appendChild(info);
  }
  const send=document.createElement("button"); send.className="primary"; send.textContent="Send order →"; send.disabled=!draft.lines.length||!!pending||atCapacity; send.onclick=sendDraft; app.appendChild(send);
  if(FLOW.stations.some(s=>s.type==="detail")){   // "drop now, detail later" — only when a detail station exists
    const qd=document.createElement("button"); qd.textContent="⛅ Quick drop (detail later)"; qd.style.marginLeft="8px"; qd.disabled=!!pending; qd.onclick=quickDrop; app.appendChild(qd);
  }
  // quotes / estimates: save the current draft to come back to, or load a saved one into the order
  if(FLOW.endpoints.quotes){
    const sq=document.createElement("button"); sq.textContent="Save as quote"; sq.style.margin="0 0 0 8px"; sq.disabled=!draft.lines.length||!!pending;
    sq.onclick=()=>{ DB=loadDB(); DB.quoteSeq=(DB.quoteSeq||0)+1; DB.quotes.push({ id:"Q"+DB.quoteSeq, num:DB.quoteSeq, lines:draft.lines.map(l=>({...l})), customer:draft.customer||null, total:+draft.lines.reduce((s,l)=>s+l.price*l.qty,0).toFixed(2), createdAt:new Date().toISOString().slice(11,16) }); draft={lines:[]}; saveDB(DB); render(); }; app.appendChild(sq);
    const quotes=DB.quotes||[];
    if(quotes.length){ const qc=document.createElement("div"); qc.className="card"; qc.style.marginTop="12px"; qc.innerHTML="<div class='row'><b>Saved quotes</b></div>";
      quotes.forEach(q=>{ const row=document.createElement("div"); row.className="line";
        row.innerHTML="<span>Quote #"+q.num+" · "+q.lines.length+" item(s) · "+money(q.total)+(q.customer?" <small class='muted'>"+(q.customer.name||q.customer.phone)+"</small>":"")+"</span><span class='spacer'></span>";
        const load=document.createElement("button"); load.className="good"; load.textContent="Load"; load.style.padding="4px 10px";
        load.onclick=()=>{ draft={ lines:q.lines.map(l=>({...l, stage:0})), customer:q.customer||undefined }; DB=loadDB(); DB.quotes=DB.quotes.filter(x=>x.id!==q.id); saveDB(DB); render(); }; row.appendChild(load);
        const del=document.createElement("button"); del.textContent="×"; del.style.padding="4px 10px"; del.style.marginLeft="6px"; del.onclick=()=>{ DB=loadDB(); DB.quotes=DB.quotes.filter(x=>x.id!==q.id); saveDB(DB); render(); }; row.appendChild(del);
        qc.appendChild(row); });
      app.appendChild(qc); }
  }
}

// 🔀 conditional (nested) modifiers: a modifier option or an add-on can carry a `reveal` group that only appears
// once it's chosen (e.g. "Add cheese" → "Which cheese?"). Groups expand across the list, so reveals can nest.
function revealedGroups(item){
  const out=[...(item.modifiers||[])];
  (item.addons||[]).forEach(a=>{ if(a.reveal && pending.addons.some(x=>x.name===a.name) && out.indexOf(a.reveal)<0) out.push(a.reveal); });
  for(let i=0;i<out.length;i++){ const chosen=pending.choices[out[i].group]; if(chosen && chosen.reveal && out.indexOf(chosen.reveal)<0) out.push(chosen.reveal); }
  return out;
}
function configPanel(station){
  const item=pending.item; const c=document.createElement("div"); c.className="card"; c.style.borderColor="var(--brand)";
  c.innerHTML="<b>"+item.name+"</b>";
  revealedGroups(item).forEach((g,gi)=>{
    const wrap=document.createElement("div"); wrap.className="mgroup";
    wrap.innerHTML="<div class='lbl'>"+g.group+(g.required?" (required)":"")+"</div>";
    const opts=document.createElement("div"); opts.className="opts";
    g.options.forEach(o=>{ const b=document.createElement("button"); if(pending.choices[g.group]&&pending.choices[g.group].name===o.name) b.className="sel";
      b.textContent=o.name+(o.price?" +"+money(o.price):""); b.onclick=()=>{ pending.choices[g.group]=o; render(); }; opts.appendChild(b); });
    wrap.appendChild(opts); c.appendChild(wrap);
  });
  if(item.addons&&item.addons.length){
    const wrap=document.createElement("div"); wrap.className="mgroup"; wrap.innerHTML="<div class='lbl'>Add-ons?</div>";
    const opts=document.createElement("div"); opts.className="opts";
    item.addons.forEach(a=>{ const on=pending.addons.some(x=>x.name===a.name); const b=document.createElement("button"); if(on) b.className="sel";
      b.textContent=(on?"✓ ":"+ ")+a.name+" "+money(a.price); b.onclick=()=>{ pending.addons = on?pending.addons.filter(x=>x.name!==a.name):[...pending.addons,a]; render(); }; opts.appendChild(b); });
    wrap.appendChild(opts); c.appendChild(wrap);
  }
  if(item.flags&&item.flags.length){
    const wrap=document.createElement("div"); wrap.className="mgroup"; wrap.innerHTML="<div class='lbl'>Flags</div>";
    const opts=document.createElement("div"); opts.className="opts";
    item.flags.forEach(f=>{ const on=pending.flags.includes(f); const b=document.createElement("button"); if(on) b.className="sel";
      b.textContent=(on?"✓ ⚠ ":"⚠ ")+f; b.onclick=()=>{ pending.flags = on?pending.flags.filter(x=>x!==f):[...pending.flags,f]; render(); }; opts.appendChild(b); });
    wrap.appendChild(opts); c.appendChild(wrap);
  }
  if(item.performer){
    const wrap=document.createElement("div"); wrap.className="mgroup"; wrap.innerHTML="<div class='lbl'>Performed by (required)</div>";
    const opts=document.createElement("div"); opts.className="opts";
    (FLOW.performers||[]).forEach(name=>{ const b=document.createElement("button"); if(pending.performer===name) b.className="sel"; b.textContent=name; b.onclick=()=>{ pending.performer=name; render(); }; opts.appendChild(b); });
    wrap.appendChild(opts); c.appendChild(wrap);
  }
  const active=revealedGroups(item);
  const reqMet=active.every(g=>!g.required||pending.choices[g.group]) && (!item.performer || pending.performer);
  const add=document.createElement("button"); add.className="primary"; add.textContent="Add to order"; add.disabled=!reqMet; add.style.marginRight="8px";
  add.onclick=()=>{ const choices={}; active.forEach(g=>{ if(pending.choices[g.group]) choices[g.group]=pending.choices[g.group]; });   // only choices for groups still shown (a deselected reveal drops its choice)
    addLine(item, choices, pending.addons, pending.flags, pending.performer); pending=null; render(); };
  const cancel=document.createElement("button"); cancel.textContent="Cancel"; cancel.onclick=()=>{ pending=null; render(); };
  c.appendChild(add); c.appendChild(cancel);
  return c;
}

/* --- UNIQUE / SERIALIZED INVENTORY: an item marked `serialized` becomes an individually-tracked UNIT with a
   durable tag (HSL for a cleaner, serial for jewelry, IMEI for a repair). Each unit is its own line and flows
   through the item's stops before it's fulfilled. Generalizes per-piece garment tracking — it's just unique
   inventory with stops before it sells. `tagLabel` names the tag; history recall keys off the tag across visits. */
function genUnitTag(){ return (Math.floor(performance.now()).toString(36) + Math.floor(Math.random()*46656).toString(36)).toUpperCase().slice(-7); }
function unitHistory(tag){ if(!tag) return []; try{ return (loadDB().records||[]).filter(r => (r.lines||[]).some(l => l.tag===tag)); }catch(e){ return []; } }
function tagChip(l){ if(!l||!l.serialized) return ""; const lbl=l.tagLabel||"Tag"; const seen=unitHistory(l.tag).length;
  return " <span class='pill' title='"+lbl+"'>🏷 "+(l.tag||"—")+"</span>" + (seen?" <span class='pill' style='border-color:var(--good);color:var(--good)'>↩ returning ×"+(seen+1)+"</span>":""); }
function addLine(item, choices, addons, flags, performer){
  const mods=[...Object.values(choices||{}), ...(addons||[])];
  const price=item.price + mods.reduce((s,m)=>s+(m.price||0),0);
  const modLabel=mods.map(m=>m.name).filter(Boolean).join(", ");
  const cart = editingId ? ((DB.records||[]).find(r=>r.id===editingId)||draft) : draft;   // detailing edits the order; intake edits the draft
  cart.lines.push({ id:"L"+Math.round(performance.now())+Math.floor(Math.random()*1e4), catId:item.id, name:item.name, modLabel, flags:(flags||[]).slice(), performer:performer||null, price, qty:1, category:item.category, path:item.path.slice(), stage:0, course:item.course||1,
    seat: (editingId ? null : (draft && draft.seat) || null),   // 👤 dine-in: which seat this line rings to (null = whole table)
    serialized: !!item.serialized, tag: item.serialized ? genUnitTag() : undefined, tagLabel: item.serialized ? (item.tagLabel||"Tag") : undefined });
  if(editingId) saveDB(DB);
  render();
}
/* PRICE-AT-RING resolver — turns a catalog item into the item that actually gets added, handling the two
   "price isn't fixed" cases before a line exists:
   • byWeight — item priced per unit (item.price = $/unit, item.unit = "lb"/"ft"/…): ask the AMOUNT, line
     price = unitPrice × amount, and annotate the name with the math so the ticket reads "2.4 lb × $8.99".
   • customPrice — item priced per sale (quote/haggle): ask the total.
   Returns a possibly-modified clone, or null if the clerk cancels. One place, so intake + detail agree. */
function priceItem(item){
  if(item.byWeight){
    const unit=item.unit||"lb"; const per=Number(item.price)||0;
    const v=prompt("How many "+unit+" of "+item.name+"?  ("+money(per)+" / "+unit+")", "1");
    if(v==null) return null; const amt=Number(v);
    if(isNaN(amt)||amt<=0){ flash("Enter an amount"); return null; }
    return {...item, price:+(per*amt).toFixed(2), name:item.name+" ("+(+amt.toFixed(3))+" "+unit+" × "+money(per)+")"};
  }
  if(item.customPrice){
    const v=prompt("Price for "+item.name+":", item.price||"");
    if(v==null) return null; const n=Number(v);
    if(isNaN(n)||n<0){ flash("Enter a price"); return null; }
    return {...item, price:+n.toFixed(2)};
  }
  // ⏰ happy-hour: ring the happy price when the window is live (a fixed-price item)
  const now=itemPriceNow(item); if(now!==item.price) return {...item, price:now};
  return item;
}
function sendDraft(){
  DB=loadDB(); DB.seq++;
  const rec={ id:"R"+DB.seq, number:DB.seq, lines:draft.lines.map(l=>({...l, stage:0})), tenders:[], createdAt:new Date().toISOString().slice(11,16), ts:Date.now() };
  if(draft.orderType) rec.orderType=draft.orderType;   // 🚗 dine-in / to-go / drive-thru
  if(draft.channel) rec.channel=draft.channel;         // 🌐 in-house vs an online/delivery order handed in by the hub
  if(storesOn()) rec.storeId = storeForOrder(draft.customer);   // order belongs to a store (customer's, else this device's, else plant)
  if(draft.tableId){ rec.tableId = draft.tableId;   // ring the check to its table; nudge an empty table to "occupied"
    DB.tables=DB.tables||{}; const cur=DB.tables[draft.tableId]; if(!cur || cur.state==="empty" || !cur.state){ DB.tables[draft.tableId]={ state:"ordered", since:Date.now(), seatedTs:(cur&&cur.seatedTs)||Date.now() }; } }
  rec.status = allComplete(rec) ? "READY" : "INPROGRESS";
  const dep = FLOW.endpoints.payment.deposit;
  if(draft.takeDeposit && dep){ rec.tenders.push({ type:"deposit", amount:+(recordTotal(rec)*dep.pct/100).toFixed(2) }); }
  if(draft.customer){                          // persist the customer + remember 'the usual'
    rec.customer={ name:draft.customer.name, phone:draft.customer.phone };
    let c=DB.customers.find(x=>x.phone===draft.customer.phone);
    if(!c){ c={ phone:draft.customer.phone, name:draft.customer.name }; DB.customers.push(c); }
    c.name = draft.customer.name || c.name;
    if(storesOn() && !c.storeId) c.storeId = rec.storeId;   // remember the customer's home store
    c.lastItems = rec.lines.map(l=>({ catId:l.catId, name:l.name, price:l.price, qty:l.qty, category:l.category, path:(l.path||[]).slice(), performer:l.performer||null, modLabel:l.modLabel||"", flags:(l.flags||[]).slice() }));
  }
  DB.records.push(rec); saveDB(DB);
  logActivity("order", "created — "+rec.lines.length+" item(s), "+money(recordTotal(rec))+(rec.customer?" · "+rec.customer.name:""), rec.number);
  if(draft.takeDeposit && dep) logActivity("money", "deposit taken "+money((rec.tenders.find(t=>t.type==="deposit")||{}).amount||0), rec.number);
  draft=null; render();
}
/* QUICK DROP — take an order now as a piece count, itemize it later at a detail station ("drop now, detail
   later"): a cleaner counts bags at the counter and details at the plant; a repair shop takes the device and
   quotes after diagnosis. General — enabled just by having a `detail` station in the flow. */
function quickDrop(){
  const n=parseInt(prompt("How many pieces are being dropped?","1"),10); if(!n||n<1) return;
  DB=loadDB(); DB.seq++;
  const rec={ id:"R"+DB.seq, number:DB.seq, lines:[], tenders:[], createdAt:new Date().toISOString().slice(11,16), ts:Date.now(), undetailed:true, dropCount:n, status:"INPROGRESS" };
  if(storesOn()) rec.storeId = storeForOrder(draft&&draft.customer);
  if(draft && draft.customer){ rec.customer={ name:draft.customer.name, phone:draft.customer.phone };
    let c=DB.customers.find(x=>x.phone===draft.customer.phone); if(!c){ c={ phone:draft.customer.phone, name:draft.customer.name }; DB.customers.push(c); } if(storesOn()&&!c.storeId) c.storeId=rec.storeId; }
  DB.records.push(rec); saveDB(DB);
  logActivity("order", "quick-drop — "+n+" piece(s) taken in"+(rec.customer?" · "+rec.customer.name:""), rec.number);
  draft=null; render();
}

/* --- ASSEMBLY: smart bag splitting + in/out reconciliation — both opt-in via station config (inert otherwise).
   station.bag = { max:N, solo:[cats], spread:[cats] } — group this order's pieces into numbered bags: `solo`
   categories bag alone (e.g. comforters), `spread` categories go at most one per bag (spread thick items
   across bags), the rest fill bags up to `max`. Pure + general — any trade that bags/boxes/totes an order.
   station.reconcile = true — every piece must be counted out before the order can leave the station:
   count-in (pieces that arrived) must equal count-out. A loss-prevention gate, keyed per station. */
function bagLines(units, cfg){
  const max=Math.max(1, (cfg&&cfg.max)||4), solo=new Set((cfg&&cfg.solo)||[]), spread=new Set((cfg&&cfg.spread)||[]);
  const bags=[]; const openBag=(isSolo)=>{ const b={items:[], spread:new Set(), solo:!!isSolo}; bags.push(b); return b; };
  units.filter(u=>solo.has(u.category)).forEach(u=>{ openBag(true).items.push(u); });                 // e.g. comforters bag alone
  units.filter(u=>!solo.has(u.category)).forEach(u=>{
    let bag=bags.find(b=>!b.solo && b.items.length<max && !(spread.has(u.category)&&b.spread.has(u.category)));
    if(!bag) bag=openBag(false);
    bag.items.push(u); if(spread.has(u.category)) bag.spread.add(u.category);
  });
  bags.forEach((b,i)=> b.items.forEach(u=> u.bag=i+1));
  return bags.length;
}
function bagOrder(r, station){ const n=bagLines(linesAtStation(r, station.id), station.bag||{}); r.bagsAt=r.bagsAt||{}; r.bagsAt[station.id]=n; saveDB(DB); render(); }
function bagChip(l){ return l.bag ? " <span class='pill' title='Bag'>🧺 bag "+l.bag+"</span>" : ""; }
function reconChecked(r, station, l){ return !!(r.recon && r.recon[station.id] && r.recon[station.id][l.id]); }
function reconToggle(r, station, l){ r.recon=r.recon||{}; r.recon[station.id]=r.recon[station.id]||{}; r.recon[station.id][l.id]=!r.recon[station.id][l.id]; saveDB(DB); render(); }
function pieceCount(lines){ return lines.reduce((s,l)=>s+(l.qty||1),0); }

function renderPipeline(app, station){
  app.innerHTML="<h2>"+station.label+"</h2>";
  const recs=DB.records.filter(r=> r.status==="INPROGRESS" && linesAtStation(r, station.id).length);
  if(!recs.length){ const e=document.createElement("div"); e.className="empty card"; e.textContent="Nothing waiting."; app.appendChild(e); }
  recs.forEach(r=>{ const mine=linesAtStation(r, station.id); const c=document.createElement("div"); c.className="card";
    c.innerHTML="<div class='row'><b>#"+r.number+"</b> <span class='pill'>"+r.status+"</span>"+clockChip(r)+storeChip(r)+tableChip(r)+orderTypeChip(r)+channelChip(r)+"<span class='spacer'></span><span class='muted'>"+r.createdAt+"</span></div>";
    let hasFlags=false, reconOk=true;
    mine.forEach(l=>{ const row=document.createElement("div"); row.className="line"; const next=l.path[l.stage+1];
      const flagHtml=(l.flags||[]).map(f=>{ hasFlags=true; return " <span class='pill flag'>⚠ "+f+"</span>"; }).join("");
      const perfHtml=l.performer?" <span class='pill'>"+l.performer+"</span>":"";
      if(station.reconcile){ const ck=reconChecked(r,station,l); if(!ck) reconOk=false; const cb=document.createElement("button"); cb.textContent=ck?"✓":"○"; cb.title="Count this piece out"; cb.style.cssText="padding:2px 9px;margin-right:4px"; if(ck) cb.className="sel"; cb.onclick=()=>reconToggle(r,station,l); row.appendChild(cb); }
      row.insertAdjacentHTML("beforeend","<span>"+l.qty+"× "+l.name+(l.modLabel?" <small class='mods'>"+l.modLabel+"</small>":"")+seatChip(l)+perfHtml+flagHtml+tagChip(l)+bagChip(l)+"</span><span class='spacer'></span><span class='muted'>"+(next?"→ "+next:"→ ready")+"</span>"); c.appendChild(row); });
    if(station.bag){ const bagged=mine.some(l=>l.bag); const bw=document.createElement("div"); bw.className="mgroup"; bw.innerHTML="<div class='lbl'>Assembly bags</div>";
      const bb=document.createElement("button"); bb.textContent=bagged?("🧺 Re-bag ("+((r.bagsAt&&r.bagsAt[station.id])||0)+" bag(s))"):("🧺 Bag these "+pieceCount(mine)+" piece(s)"); bb.onclick=()=>bagOrder(r,station); bw.appendChild(bb); c.appendChild(bw); }
    if(printOn()){ const pw=document.createElement("div"); pw.className="mgroup"; pw.innerHTML="<div class='lbl'>Print</div>";
      const pt=document.createElement("button"); pt.textContent="🖨 Ticket"; pt.onclick=()=>printDoc("ticket",docTicket(r),{storeId:r.storeId,number:r.number}); pw.appendChild(pt);
      const serial=mine.filter(l=>l.serialized); if(serial.length){ const pg=document.createElement("button"); pg.textContent="🖨 Tags ("+serial.length+")"; pg.style.marginLeft="6px"; pg.onclick=()=>serial.forEach(l=>printDoc("tag",docTag(r,l),{storeId:r.storeId,number:r.number,tag:l.tag})); pw.appendChild(pg); }
      const inbags=mine.filter(l=>l.bag); if(inbags.length){ const cnts={}; inbags.forEach(l=>cnts[l.bag]=(cnts[l.bag]||0)+1); const pb=document.createElement("button"); pb.textContent="🖨 Bag labels"; pb.style.marginLeft="6px"; pb.onclick=()=>Object.keys(cnts).forEach(n=>printDoc("bagLabel",docBagLabel(r,+n,cnts[n]),{storeId:r.storeId,number:r.number,bag:+n})); pw.appendChild(pb); }
      c.appendChild(pw); }
    // checklist-as-gate: steps at this station must all be done before the record can advance
    let checksOk=true;
    if(station.checklist && station.checklist.length){
      r.checks=r.checks||{}; const done=r.checks[station.id]||{};
      const wrap=document.createElement("div"); wrap.className="mgroup"; wrap.innerHTML="<div class='lbl'>Checklist (required)</div>";
      const opts=document.createElement("div"); opts.className="opts";
      station.checklist.forEach((step,i)=>{ const on=!!done[i]; if(!on) checksOk=false; const bb=document.createElement("button"); if(on) bb.className="sel"; bb.textContent=(on?"✓ ":"○ ")+step; bb.onclick=()=>{ r.checks=r.checks||{}; r.checks[station.id]=r.checks[station.id]||{}; r.checks[station.id][i]=!on; saveDB(DB); render(); }; opts.appendChild(bb); });
      wrap.appendChild(opts); c.appendChild(wrap);
    }
    if(station.reconcile){ const inN=pieceCount(mine), outN=pieceCount(mine.filter(l=>reconChecked(r,station,l))); const rc=document.createElement("div"); rc.className="muted"; rc.style.cssText="margin:6px 0"+(reconOk?"":";color:var(--bad)"); rc.textContent=outN+" of "+inN+" pieces counted out"+(reconOk?" ✓":" — count every piece to continue"); c.appendChild(rc); }
    const needAck = hasFlags && !r.acked;   // acknowledged once per record; persists + broadcasts
    if(needAck){ const a=document.createElement("button"); a.className="primary"; a.textContent="⚠ Acknowledge & continue"; a.style.marginTop="10px"; a.onclick=()=>{ r.acked=true; saveDB(DB); render(); }; c.appendChild(a); }
    else { const b=document.createElement("button"); b.className="good"; b.textContent="Mark done here"; b.style.marginTop="10px"; b.disabled=!checksOk || (station.reconcile && !reconOk); b.onclick=()=>{ mine.forEach(l=>l.stage++); afterChange(r); render(); }; c.appendChild(b); }
    app.appendChild(c); });
}

/* DETAIL STATION — itemize a "quick drop" order: reuses the intake catalog + config panel (via addLine's
   activeCart hook) to add/price/tag real pieces onto the dropped order, then "Done detailing" releases it
   onto its normal path. Generalizes a cleaner's quick→detail two-step to any drop-now/itemize-later trade. */
function renderDetail(app, station){
  if(editingId && !(DB.records||[]).find(r=>r.id===editingId)) editingId=null;
  const rec = editingId ? (DB.records||[]).find(r=>r.id===editingId) : null;
  if(!rec){
    app.innerHTML="<h2>"+station.label+"</h2><p class='muted'>Orders dropped, waiting to be itemized.</p>";
    const undetailed=DB.records.filter(r=>r.undetailed);
    if(!undetailed.length){ const e=document.createElement("div"); e.className="empty card"; e.textContent="Nothing waiting to detail."; app.appendChild(e); }
    undetailed.forEach(r=>{ const c=document.createElement("div"); c.className="card"; const cnt=r.dropCount||r.lines.length;
      c.innerHTML="<div class='row'><b>#"+r.number+"</b>"+storeChip(r)+clockChip(r)+"<span class='spacer'></span><span class='muted'>"+(r.customer?r.customer.name+" · ":"")+cnt+" piece(s) dropped</span></div>";
      const open=document.createElement("button"); open.className="primary"; open.textContent="Detail this order"; open.style.marginTop="8px"; open.onclick=()=>{ editingId=r.id; pending=null; render(); }; c.appendChild(open);
      app.appendChild(c); });
    return;
  }
