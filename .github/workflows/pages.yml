name: deploy demo to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Publish a static site: the landing page + the builder + the engine + the self-contained one-file build.
      - name: Assemble the site
        run: |
          mkdir -p _site
          node build.js                       # produces dist/custompos.html (engine inlined)
          node tools/gen-landing.js                       # (re)generate per-trade SEO landing pages
          cp index.html builder.html pos.html _site/
          cp dist/custompos.html _site/app.html
          cp restaurant.html retail.html salon.html repair-shop.html dry-cleaner.html jewelry.html _site/
          # the Single-PC Edition: its landing page, the one-file app (Try it / Download), and the page's screenshot
          cp single-pc.html _site/
          # the Claude spotlight: how the origin shop changes its live POS by asking (a page not on this list 404s live)
          cp built-with-claude.html _site/
          mkdir -p _site/single-pc _site/press
          cp single-pc/ozark-pos-single-pc.html single-pc/README.md single-pc/LICENSE _site/single-pc/
          cp press/07-single-pc.png _site/press/
          # SEO assets: crawler rules, sitemap, and the social-share image
          cp robots.txt sitemap.xml og.png _site/
          # land on the marketing page by default
          cp index.html _site/index.html
          # custom domain (apex): serve the site at custompos.org
          echo 'custompos.org' > _site/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
